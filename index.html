<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8a4d22"><meta name="apple-mobile-web-app-title" content="zen·dom"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.json"><style>body{margin:0}</style><script src="firebase-bundle.js"></script></head><body>
<title>zen·dom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Figtree:wght@400;500;600;700&family=Pixelify+Sans:wght@400;500&family=Jersey+15&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm phone column; sticky top bar with who's-using toggle, fixed bottom tab bar, bottom-sheet forms. */
:root{
  --bg:#f2f5f0;        /* mint-tinted paper */
  --surface:#ffffff;
  --surface-2:#e8eee6;
  --ink:#2e3934;
  --muted:#6a7770;
  --line:#d9e1d6;
  --accent:#7fae8c;       /* accent (palette-dependent) */
  --on-accent:#14301d;
  --hero-deco:none;
  --accent-ink:#2f5c3d;
  --sam:#e48c78;        /* Sam's color: peach */
  --sam-soft:#fbe3dc;
  --charlie:#6b97d1;    /* Charlie's color: denim */
  --charlie-soft:#dfe9f7;
  --paprika:#dc9a4e;    /* the cat: apricot */
  --paprika-soft:#f8e6cf;
  --warn:#c98a1d; --warn-soft:#fbefd2;
  --late:#c0645a; --late-soft:#f8e0dc;
  --ok:#4f8f63; --ok-soft:#dcefe1;
  --note-butter:#fbefc0; --note-blush:#f9dcd6; --note-mint:#d7efe0; --note-lilac:#e6def6;
  --shadow:0 1px 2px rgba(46,57,52,.06),0 4px 14px rgba(46,57,52,.06);
  --f-display:"Fredoka","Nunito","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-pixel:"Pixelify Sans","Courier New",monospace;
  --r-card:22px; --r-pill:999px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b211e; --surface:#252d29; --surface-2:#2e3833; --ink:#e7eee8; --muted:#a2b0a8; --line:#36423c;
  --accent:#8fc09c; --accent-ink:#bfe3c8; --sam:#f0a08d; --sam-soft:#4a3029; --charlie:#8db2e6; --charlie-soft:#2a3a52;
  --paprika:#e8ad66; --paprika-soft:#4a3a24; --warn:#e6b55a; --warn-soft:#43381f; --late:#e58d82; --late-soft:#4a2b28;
  --ok:#86c79a; --ok-soft:#24402d; --note-butter:#4a4226; --note-blush:#4b322e; --note-mint:#27402f; --note-lilac:#3a3350;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b211e; --surface:#252d29; --surface-2:#2e3833; --ink:#e7eee8; --muted:#a2b0a8; --line:#36423c;
  --accent:#8fc09c; --accent-ink:#bfe3c8; --sam:#f0a08d; --sam-soft:#4a3029; --charlie:#8db2e6; --charlie-soft:#2a3a52;
  --paprika:#e8ad66; --paprika-soft:#4a3a24; --warn:#e6b55a; --warn-soft:#43381f; --late:#e58d82; --late-soft:#4a2b28;
  --ok:#86c79a; --ok-soft:#24402d; --note-butter:#4a4226; --note-blush:#4b322e; --note-mint:#27402f; --note-lilac:#3a3350;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

/* ---- hero + ground tokens (seasons override these) ---- */
:root{--hero-bg:var(--surface);--hero-ink:var(--ink);--hero-muted:var(--muted);--ground-a:var(--accent);--ground-b:var(--ok-soft)}

/* ---- personal palettes: data-palette on <html> (sage is the default above) ---- */
:root[data-palette="blue"]{--bg:#eef3fa;--surface-2:#e1e9f5;--line:#d2ddee;--accent:#5b8fd6;--accent-ink:#234a82;--on-accent:#0d1f3c;--ink:#26324a;--muted:#66728a}
:root[data-palette="ochre"]{--bg:#f7f0e4;--surface-2:#efe2cc;--line:#e4d2b4;--accent:#c48a2a;--accent-ink:#6b4410;--on-accent:#2b1a04;--ink:#3a2e22;--muted:#7a6a58}
@media (prefers-color-scheme: dark){
  :root[data-palette="blue"]:not([data-theme="light"]){--bg:#161d2b;--surface:#1f293b;--surface-2:#28354d;--line:#334260;--accent:#86aef0;--accent-ink:#c4d8fb;--on-accent:#0d1f3c;--ink:#e6edf8;--muted:#9fadc6}
  :root[data-palette="ochre"]:not([data-theme="light"]){--bg:#211a13;--surface:#2c231a;--surface-2:#392e22;--line:#4a3c2c;--accent:#dcaa4c;--accent-ink:#f3d9a4;--on-accent:#2b1a04;--ink:#f1e7da;--muted:#b8a690}
}
:root[data-theme="dark"][data-palette="blue"]{--bg:#161d2b;--surface:#1f293b;--surface-2:#28354d;--line:#334260;--accent:#86aef0;--accent-ink:#c4d8fb;--on-accent:#0d1f3c;--ink:#e6edf8;--muted:#9fadc6}
:root[data-theme="dark"][data-palette="ochre"]{--bg:#211a13;--surface:#2c231a;--surface-2:#392e22;--line:#4a3c2c;--accent:#dcaa4c;--accent-ink:#f3d9a4;--on-accent:#2b1a04;--ink:#f1e7da;--muted:#b8a690}

/* ---- seasons: data-season on <html>. The doubled attribute raises specificity above the palettes. ---- */
:root[data-season="halloween"][data-season]{--accent:#e0782a;--accent-ink:#8a3e0b;--on-accent:#2a1204;--hero-bg:#2f2442;--hero-ink:#fbeedd;--hero-muted:#cdbbe0;--ground-a:#e0782a;--ground-b:#5b3f86}
:root[data-season="christmas"][data-season]{--accent:#c8453c;--accent-ink:#8f2a23;--on-accent:#ffffff;--hero-bg:#1f4a36;--hero-ink:#ffffff;--hero-muted:#cfe6d8;--ground-a:#ffffff;--ground-b:#e7efe9}
:root[data-season="birthday"][data-season]{--accent:#e8559a;--accent-ink:#a3226a;--on-accent:#ffffff;--hero-bg:#fff4b8;--hero-ink:#3b2440;--hero-muted:#7b5a7f;--ground-a:#ff86bf;--ground-b:#7fdcd8;--bd-dot1:#ffc1dc;--bd-dot2:#b6ece9;--bd-edge:#3b2440}
@media (prefers-color-scheme: dark){
  :root[data-season="halloween"][data-season]:not([data-theme="light"]){--accent:#f0974a;--accent-ink:#ffc48f;--on-accent:#2a1204}
  :root[data-season="christmas"][data-season]:not([data-theme="light"]){--accent:#e2675d;--accent-ink:#ffb3ab;--on-accent:#2a0c09;--ground-a:#dfe9e3;--ground-b:#9fb7a9}
  :root[data-season="birthday"][data-season]:not([data-theme="light"]){--accent:#ff86bf;--accent-ink:#ffc1dc;--on-accent:#3a0a22;--hero-bg:#3d2a4a;--hero-ink:#fff2f8;--hero-muted:#d9b9e0;--bd-dot1:#4a2c45;--bd-dot2:#24413f;--bd-edge:#ff86bf}
}
:root[data-theme="dark"][data-season="halloween"][data-season]{--accent:#f0974a;--accent-ink:#ffc48f;--on-accent:#2a1204}
:root[data-theme="dark"][data-season="christmas"][data-season]{--accent:#e2675d;--accent-ink:#ffb3ab;--on-accent:#2a0c09;--ground-a:#dfe9e3;--ground-b:#9fb7a9}
:root[data-theme="dark"][data-season="birthday"][data-season]{--accent:#ff86bf;--accent-ink:#ffc1dc;--on-accent:#3a0a22;--hero-bg:#3d2a4a;--hero-ink:#fff2f8;--hero-muted:#d9b9e0;--bd-dot1:#4a2c45;--bd-dot2:#24413f;--bd-edge:#ff86bf}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:.005em}
h2{font-size:1.15rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.pixel{image-rendering:pixelated;shape-rendering:crispEdges;display:block}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-size:1.45rem;font-weight:600;letter-spacing:.01em;display:flex;align-items:baseline;gap:2px}
.brand .dot{color:var(--accent)}
.who{display:flex;background:var(--surface-2);border-radius:var(--r-pill);padding:3px;gap:2px}
.top{flex-wrap:wrap}
.netpill{flex-basis:100%;order:3;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:2px;padding:5px 10px;border-radius:4px;
  background:#3b2a1e;color:#ffe9c4;font-size:.85rem;font-weight:600;box-shadow:inset 0 0 0 2px #6b4a2e}
.netpill .dot{width:8px;height:8px;border-radius:2px;background:#e8a23a;box-shadow:0 0 0 2px rgba(232,162,58,.3)}
.netpill[hidden]{display:none}
.who button{border:0;background:transparent;border-radius:var(--r-pill);padding:4px 10px 4px 4px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:.9rem;color:var(--muted)}
.who button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.who .av{width:26px;height:26px;border-radius:50%;overflow:hidden;background:var(--surface)}

/* banners */
.banner{border-radius:16px;padding:10px 14px;margin-block:4px 10px;font-size:.92rem;background:var(--warn-soft);color:var(--ink);display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.banner button{border:0;background:transparent;font-weight:700;color:var(--muted);flex:none}

/* sections & cards */
.view{display:flex;flex-direction:column;gap:18px;padding-block:6px 10px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.label{font-family:var(--f-pixel);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);padding:16px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:var(--r-card);padding:18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{margin:0;max-width:34ch}

/* hero */
.hero{display:flex;align-items:flex-end;gap:14px;background:var(--hero-bg);color:var(--hero-ink);border-radius:28px;box-shadow:var(--shadow);padding:16px 16px 0;overflow:hidden;position:relative}
.hero-text{flex:1;min-width:0;padding-bottom:16px}
.hero-text h1{font-size:1.55rem;line-height:1.15}
.hero-text p{margin:6px 0 0;color:var(--hero-muted);font-size:.95rem}
.hero-text .season{font-family:var(--f-pixel);font-size:.8rem;letter-spacing:.05em;color:var(--hero-muted);margin:0 0 4px}
.trio{display:flex;align-items:flex-end;flex:none}
.trio{position:relative;z-index:1}
.trio .s{width:72px;height:72px}
.trio .c{width:72px;height:72px;margin-left:-6px}
.trio .p{width:48px;height:48px;margin-left:-4px}
.hero.has-room{flex-direction:column;align-items:stretch;gap:4px;padding:16px 12px 12px}
.hero.has-room .hero-text{padding:0 4px}
.room{margin:0 -4px;position:relative;z-index:1}
.room canvas{display:block;width:100%;height:auto;aspect-ratio:200/160;image-rendering:pixelated;image-rendering:crisp-edges;filter:drop-shadow(0 5px 0 rgba(60,40,20,.13));-webkit-tap-highlight-color:transparent}
.roomnote{align-self:center;display:inline-flex;align-items:center;gap:8px;border:0;background:color-mix(in srgb,var(--hero-ink) 10%,transparent);color:var(--hero-ink);font:inherit;font-size:.82rem;font-weight:600;border-radius:999px;padding:6px 12px;position:relative;z-index:1;cursor:pointer}
.roomnote .bx{width:14px;height:9px;border-radius:5px 6px 3px 3px;background:linear-gradient(90deg,#7ba7dc 0 40%,#ff9f8a 40% 70%,#ffd34d 70%);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.ground{position:absolute;left:0;right:0;bottom:0;height:10px;background:repeating-linear-gradient(90deg,var(--ground-a) 0 8px,var(--ground-b) 8px 16px);opacity:.7}

/* buttons */
.btn{border:0;border-radius:var(--r-pill);padding:10px 16px;font-weight:600;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;gap:6px;justify-content:center;min-height:44px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--late-soft);color:var(--late)}
.btn.small{min-height:34px;padding:6px 12px;font-size:.88rem}
.link{border:0;background:transparent;color:var(--accent-ink);font-weight:700;padding:6px 4px;font-size:.9rem}
.fab{position:fixed;z-index:8;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(84px + env(safe-area-inset-bottom,0px));border:0;border-radius:var(--r-pill);background:var(--ink);color:var(--bg);font-weight:700;padding:12px 18px;box-shadow:0 8px 24px rgba(0,0,0,.18);min-height:48px;display:flex;align-items:center;gap:6px}

/* segmented */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;border-radius:var(--r-pill);padding:7px 13px;background:var(--surface-2);font-weight:600;font-size:.9rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip .av{width:22px;height:22px}

/* chore rows */
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;min-height:62px}
.row .body{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:4px 0;display:flex;flex-direction:column;gap:2px}
.row .title{font-weight:600;overflow-wrap:anywhere}
.row .meta{font-size:.84rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row.done .title{text-decoration:line-through;color:var(--muted)}
.check{flex:none;width:40px;height:40px;border-radius:14px;border:2.5px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:transform .15s,background .15s}
.check svg{opacity:0}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.check[aria-pressed="true"] svg{opacity:1}
.check:active{transform:scale(.92)}
.owner{flex:none;width:34px;height:34px;border-radius:12px;overflow:hidden;background:var(--surface-2)}
.owner.sam{background:var(--sam-soft)} .owner.charlie{background:var(--charlie-soft)}
.owner.none{display:grid;place-items:center;font-family:var(--f-pixel);color:var(--muted);font-size:.8rem}
.pill{border-radius:var(--r-pill);padding:1px 8px;font-size:.78rem;font-weight:700;background:var(--surface-2);color:var(--muted)}
.pill.late{background:var(--late-soft);color:var(--late)}
.pill.today{background:var(--warn-soft);color:var(--warn)}
.pill.soon{background:var(--charlie-soft);color:var(--charlie)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.ex{background:var(--note-lilac);color:var(--ink)}

/* family */
.prof{display:flex;gap:14px;align-items:center}
.prof .big{width:88px;height:88px;border-radius:24px;flex:none;overflow:hidden}
.prof.sam .big{background:var(--sam-soft)} .prof.charlie .big{background:var(--charlie-soft)} .prof.paprika .big{background:var(--paprika-soft)}
.prof h2{font-size:1.5rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}
.fact{background:var(--surface-2);border-radius:14px;padding:8px 12px;min-width:0}
.fact b{display:block;font-size:.98rem;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--late-soft);color:var(--ink);border-radius:var(--r-pill);padding:5px 6px 5px 12px;display:inline-flex;gap:4px;align-items:center;font-weight:600;font-size:.9rem}
.tag button{border:0;background:transparent;width:26px;height:26px;border-radius:50%;color:var(--muted);font-size:1rem;line-height:1}
.item{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);border:0;width:100%;text-align:left;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:.84rem;color:var(--muted)}
.item > div{min-width:0}
.suggest{display:flex;flex-wrap:wrap;gap:6px}
.suggest button{border:1.5px dashed var(--line);background:transparent;border-radius:var(--r-pill);padding:5px 11px;font-size:.86rem;color:var(--muted);font-weight:600}
.private{font-size:.82rem;color:var(--muted);display:flex;gap:6px;align-items:center}

/* notes board */
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.note{border:0;text-align:left;border-radius:18px;padding:12px 12px 10px;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;box-shadow:var(--shadow);color:var(--ink)}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.95rem}
.note .by{font-family:var(--f-pixel);font-size:.72rem;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.n-butter{background:var(--note-butter)} .n-blush{background:var(--note-blush)} .n-mint{background:var(--note-mint)} .n-lilac{background:var(--note-lilac)}
.note:nth-child(odd){transform:rotate(-.6deg)} .note:nth-child(even){transform:rotate(.5deg)}

/* soon cards */
.soon-card{display:flex;gap:12px;align-items:flex-start}
.soon-card .ic{width:40px;height:40px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.soon-card p{margin:2px 0 0;font-size:.9rem;color:var(--muted)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav button{border:0;background:transparent;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:.74rem;font-weight:600;color:var(--muted);min-height:52px}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--ink);background:var(--surface-2)}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(20,28,24,.38);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:26px 26px 0 0;max-height:88vh;overflow:auto;
  padding:8px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:0 -10px 30px rgba(0,0,0,.18)}
.sheet .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 2px}
.sheet h2{font-size:1.3rem}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.field .lab{font-weight:600;font-size:.9rem}
.field input,.field select,.field textarea{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:11px 12px;min-height:46px;width:100%}
.field textarea{min-height:84px;resize:vertical}
.field .hint{font-size:.82rem;color:var(--muted)}
.field .err{font-size:.84rem;color:var(--late);font-weight:600}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--late)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two > *{min-width:0}
/* radio + checkbox chips: the .field input rule must not turn the little circle into a full-size box */
.chip > input:is([type=radio],[type=checkbox]){accent-color:var(--accent);width:20px;height:20px;min-height:0;padding:0;margin:0;border:0;flex:none;background:none;box-shadow:none}
.chip:has(> input:checked){color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 2px var(--accent)}

    return false;
  }
  if(typeof syncSchedule === "function") syncSchedule();
  return true;
}

/* ---------- chore logic ---------- */
function interval(c){ return {daily:1, weekly:7, biweekly:14, custom:c.everyDays || 7}[c.freq]; }
function nextDue(c){
  if(c.freq === "once") return c.start;
  if(!c.lastDone) return c.start;
  return c.freq === "monthly" ? addMonths(c.lastDone, 1) : addDays(c.lastDone, interval(c));
}
function doneToday(c){ return c.freq === "once" ? c.done : c.lastDone === todayStr(); }
function dueInfo(c){
  if(c.freq === "once" && c.done) return {rank:5, cls:"ok", text:"Done", days:999};
  const t = todayStr(), due = nextDue(c), n = diffDays(t, due);
  if(doneToday(c)) return {rank:4, cls:"ok", text:"Done today · next " + niceDate(due), days:n};
  if(n < 0) return {rank:0, cls:"late", text: n === -1 ? "Due yesterday" : `${-n} days overdue`, days:n};
  if(n === 0) return {rank:1, cls:"today", text:"Due today", days:n};
  if(n <= 6) return {rank:2, cls:"soon", text: n === 1 ? "Due tomorrow" : `Due in ${n} days`, days:n};
  return {rank:3, cls:"", text:"Due " + niceDate(due), days:n};
}
function toggleChore(id){
  const c = state.chores.find(x => x.id === id); if(!c) return;
  if(c.freq === "once"){ c.done = !c.done; save(); render(); toast(c.done ? `Done: ${c.title}` : "Marked not done", c.done ? () => { c.done = false; save(); render(); } : null); return; }
  if(c.lastDone === todayStr()){
    c.lastDone = c.history.length ? c.history.pop() : null;   // undo today's completion
    save(); render(); toast("Marked not done"); return;
  }
  c.history.push(c.lastDone); c.history = c.history.slice(-10);
  c.lastDone = todayStr(); save(); render();
  toast(`Nice. ${c.title} is done`, () => { if(c.lastDone === todayStr()){ c.lastDone = c.history.pop() ?? null; save(); render(); } });
}

/* ---------- health logic ---------- */
function checkupInfo(c){
  if(c.next){
    const n = diffDays(todayStr(), c.next.date), at = c.next.time ? " · " + fmtTime(c.next.time) : "";
    if(n < 0) return {cls:"late", text:`Was booked for ${niceDate(c.next.date)}. Did it happen?`, due:c.next.date, n, booked:true};
    if(n === 0) return {cls:"today", text:"Today" + at, due:c.next.date, n, booked:true};
    return {cls: n <= 7 ? "soon" : "ok", text:`Booked ${niceDate(c.next.date)}${at}`, due:c.next.date, n, booked:true};
  }
  if(!c.last) return {cls:"", text:"No visit logged yet", due:null};
  const due = addMonths(c.last, c.months), n = diffDays(todayStr(), due);
  if(n < 0) return {cls:"late", text:"Overdue since " + niceDate(due), due, n};
  if(n <= 30) return {cls:"soon", text:"Due " + niceDate(due), due, n};
  return {cls:"ok", text:"Next around " + niceDate(due), due, n};
}
function vaccineInfo(v){
  if(!v.nextDue) return {cls:"", text: v.date ? "Given " + niceDate(v.date) : "No date logged", n:null};
  const n = diffDays(todayStr(), v.nextDue);
  if(n < 0) return {cls:"late", text:"Booster overdue · " + niceDate(v.nextDue), n};
  if(n <= 30) return {cls:"soon", text:"Booster due " + niceDate(v.nextDue), n};
  return {cls:"ok", text:"Next " + niceDate(v.nextDue), n};
}

/* ---------- look: palette, season, birthday ---------- */
function birthdaysToday(){
  const md = todayStr().slice(5);
  return PEOPLE.filter(k => state.people[k].birthday && state.people[k].birthday.slice(5) === md);
}
function autoSeason(){
  const t = todayStr(), m = +t.slice(5,7), d = +t.slice(8,10);
  if(m === 10) return "halloween";
  if(m === 12 && d <= 26) return "christmas";
  return null;
}
// Returns {season, birthdayFor:[...]} after preview + settings are applied.
function currentLook(){
  if(prefs.preview === "birthday") return {season:"birthday", bdays:[prefs.user]};
  if(prefs.preview) return {season:prefs.preview, bdays:[]};
  if(state.settings.seasonal === "off") return {season:null, bdays:[]};
  const b = birthdaysToday();
  if(b.length) return {season:"birthday", bdays:b};
  return {season:autoSeason(), bdays:[]};
}
function currentPalette(){
  const t = state.settings.theme;
  return t === "follow" ? state.settings.favorites[prefs.user] : t;
}
function costumesFor(key){
  const look = currentLook();
  if(look.bdays.includes(key)) return ["party"];
  if(look.season === "halloween") return [{sam:"witch", charlie:"vampire", paprika:"pumpkin"}[key]];
  if(look.season === "christmas") return [{sam:"santa", charlie:"santa", paprika:"scarf"}[key]];
  return [];
}
function applyLook(){
  const root = document.documentElement, look = currentLook();
  root.dataset.palette = currentPalette();
  if(look.season) root.dataset.season = look.season; else delete root.dataset.season;
}

  return `<div class="row ${done?"done":""}" data-chore="${c.id}">
    ${ownerCell}
    <button type="button" class="body" data-act="editChore" data-id="${c.id}">
      <span class="title">${esc(c.title)}</span>
      <span class="meta"><span class="pill ${info.cls}">${esc(info.text)}</span><span>${esc(c.freq==="custom" ? `Every ${c.everyDays} days` : FREQS[c.freq])}</span>${c.example?'<span class="pill ex">Example</span>':""}</span>

    <button type="button" class="check" data-act="toggle" data-id="${c.id}" aria-pressed="${done}" aria-label="${done?"Mark not done":"Mark done"}: ${esc(c.title)}">${IC.tick}</button>
  </div>`;
}
function sortChores(list){ return list.slice().sort((a,b) => { const x = dueInfo(a), y = dueInfo(b); return x.rank - y.rank || x.days - y.days || a.title.localeCompare(b.title); }); }

function healthAlerts(){
  const out = [];
  PEOPLE.forEach(k => {
    const p = state.people[k];
    p.checkups.forEach(c => { const i = checkupInfo(c); if(i.cls === "late" || i.cls === "soon" || i.cls === "today") out.push({k, what:c.name, i, sort:i.n}); });
    p.vaccines.forEach(v => { const i = vaccineInfo(v); if(i.cls === "late" || i.cls === "soon") out.push({k, what:v.name, i, sort:i.n}); });
  });
  return out.sort((a,b) => a.sort - b.sort);
}

/* ---- ingredient quantity parsing + scaling ---- */
const FRAC = {"½":1/2,"⅓":1/3,"⅔":2/3,"¼":1/4,"¾":3/4,"⅛":1/8,"⅜":3/8,"⅝":5/8,"⅞":7/8};
const NUM = "(?:\\d+(?:\\.\\d+)?\\s*[½⅓⅔¼¾⅛⅜⅝⅞]|\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d+(?:\\.\\d+)?|[½⅓⅔¼¾⅛⅜⅝⅞])";

  if(FRAC[s] !== undefined) return FRAC[s];
  if((m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +m[1] + (+m[3] ? +m[2] / +m[3] : 0);
  if((m = s.match(/^(\d+)\/(\d+)$/))) return +m[2] ? +m[1] / +m[2] : NaN;

}

  const q = fmtNum(p.a * f) + (p.b !== null && isFinite(p.b) ? "–" + fmtNum(p.b * f) : "");
  return (q + " " + fixUnitNumber(p.rest, hi)).trim();

// keep "1 cup" / "2 cups" grammatical after scaling (abbreviations like tbsp are left alone)
const UNIT_FORMS = [["cup","cups"],["tablespoon","tablespoons"],["teaspoon","teaspoons"],["clove","cloves"],["can","cans"],["pound","pounds"],["ounce","ounces"],["slice","slices"],["stick","sticks"],["head","heads"],["sprig","sprigs"],["bunch","bunches"],["pinch","pinches"],["package","packages"],["gram","grams"],["liter","liters"],["jar","jars"],["bag","bags"],["handful","handfuls"]];
function fixUnitNumber(rest, n){
  for(const [one, many] of UNIT_FORMS){
    const m = rest.match(new RegExp("^(" + many + "|" + one + ")\\b", "i"));
    if(m) return (n > 1 ? many : one) + rest.slice(m[0].length);
  }
  return rest;
}
// "1 cup finely grated Parmesan (about 2 oz), plus more" -> "Parmesan"
const PREP_WORDS = /\b(fresh|finely|roughly|coarsely|thinly|freshly|lightly|very|well|chopped|diced|minced|sliced|grated|shredded|peeled|crushed|drained|rinsed|softened|melted|beaten|divided|packed|sifted|toasted|cubed|halved|quartered|trimmed|julienned|seeded|stemmed|torn|cut|pitted|cooked|uncooked|large|medium|small|extra|heaping|level|about|approximately|optional)\b/gi;
function cleanIngName(s){
  return String(s || "").replace(/\([^)]*\)/g, " ")
    .replace(/\b(plus more|or more|plus extra|to taste|for serving|for garnish|as needed|if desired|at room temperature|room temperature)\b.*$/i, " ")
    .replace(PREP_WORDS, " ").replace(/^\s*(of|and)\s+/i, "").replace(/\s+(and|or|,)\s*$/i, "")
    .replace(/\s+/g, " ").trim();
}
// "2 cups flour, sifted" -> {qty:"2 cups", name:"flour"}
function groceryFromLine(line, f){
  const scaled = scaleLine(line, f);
  const p = splitIngredient(scaled);
  let rest = p.rest, unit = "";
  const um = rest.match(UNIT_RE);
  if(um && p.qtyText){ unit = um[1]; rest = rest.slice(um[0].length); }
  const name = cleanIngName(rest.split(",")[0]) || cleanIngName(scaled) || scaled.trim();
  return {qty: [p.qtyText, unit].filter(Boolean).join(" "), name: name.slice(0, 80)};
}
// "3 lb" + "3 lb" -> "6 lb"; different or unparseable units stay as "a + b"
function unitKey(u){
  u = u.toLowerCase().replace(/\.$/, "");
  const alias = {lbs:"lb", tbsps:"tbsp", tbs:"tbsp", tsps:"tsp", c:"cup"};
  if(alias[u]) return alias[u];
  const f = UNIT_FORMS.find(([one, many]) => u === one || u === many);
  return f ? f[0] : u;
}
function readQty(q){
  const m = q.trim().match(new RegExp("^(" + NUM + ")(?:\\s+(.+))?$"));
  if(!m) return null;
  const n = toNum(m[1]); if(!isFinite(n)) return null;
  return {n, unit:(m[2] || "").trim()};
}
function mergeQty(a, b){
  if(!a) return b; if(!b) return a;
  const parts = a.split(" + "), nb = readQty(b);
  if(nb){
    for(let i = 0; i < parts.length; i++){
      const pa = readQty(parts[i]);
      if(pa && unitKey(pa.unit) === unitKey(nb.unit)){
        const total = pa.n + nb.n;
        parts[i] = (fmtNum(total) + " " + (pa.unit ? fixUnitNumber(pa.unit, total) : "")).trim();
        return parts.join(" + ");
      }
    }
  }
  return a + " + " + b;
}
/* ---- "what can we make": compare recipe ingredients with the pantry ---- */
const ALWAYS_HAVE = /^(water|hot water|cold water|warm water|ice|ice water|boiling water)$/;
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
// whole-word match either way: pantry "onion" matches "red onion", but "egg" does not match "eggplant"
function nameMatch(a, b){
  const x = normName(a), y = normName(b);
  if(!x || !y) return false;
  if(x === y) return true;
  const inside = (needle, hay) => needle.length >= 3 && new RegExp("(^| )" + escRe(needle) + "( |$)").test(hay);
  return inside(y, x) || inside(x, y);
}
function inPantry(name){
  if(ALWAYS_HAVE.test(normName(name))) return true;
  return state.pantry.some(p => nameMatch(name, p.name));
}
const isOptional = line => /\boptional\b|\bfor (serving|garnish)\b|\bto serve\b|\bif desired\b/i.test(line);
const ingName = line => groceryFromLine(line, 1).name;
// Ingredients count equally; optional ones and water don't count against you. Amounts aren't compared.
function readiness(r){
  const counted = r.ingredients.filter(l => !isOptional(l) && !/:$/.test(l.trim()) && !ALWAYS_HAVE.test(normName(ingName(l))));
  const status = counted.map(l => ({line:l, have:inPantry(ingName(l))}));
  const have = status.filter(x => x.have).length;
  return {have, total:counted.length, pct: counted.length ? Math.round(100 * have / counted.length) : 0,
          haveLines: status.filter(x => x.have).map(x => x.line), missing: status.filter(x => !x.have).map(x => x.line)};
}
function readyBar(rd){
  return `<span class="ready"><span class="bar" role="img" aria-label="${rd.pct} percent of ingredients on hand"><i style="width:${rd.pct}%"></i></span><span>${rd.have} of ${rd.total} on hand · <b>${rd.pct}%</b></span></span>`;
}
// Adds lines to the grocery list. Skips pantry items and merges with an unchecked duplicate.
function addLinesToGrocery(lines, f, recipeId){
  let added = 0, merged = 0; const skipped = [];
  lines.forEach(line => {
    if(!line.trim()) return;
    const g = groceryFromLine(line, f);
    if(inPantry(g.name)){ skipped.push(g.name); return; }
    const dup = state.grocery.find(x => !x.checked && normName(x.name) === normName(g.name));
    if(dup){ if(g.qty) dup.qty = mergeQty(dup.qty, g.qty); merged++; return; }
    state.grocery.push({id:uid(), name:g.name, qty:g.qty, aisle:guessAisle(g.name), checked:false, recipeId:recipeId || null, added:Date.now()});
    added++;
  });
  return {added, merged, skipped};
}
function groceryToast(r){
  const parts = [];
  if(r.added) parts.push(`Added ${r.added}`);
  if(r.merged) parts.push(`${r.merged} merged`);
  if(r.skipped.length) parts.push(`skipped ${r.skipped.length} in pantry`);
  toast(parts.length ? parts.join(" · ") : "Nothing new to add");
}

// "1 hr 15 min", "45 minutes", "1h", "20" -> minutes (null if it can't tell)
function parseMinutes(v){
  const s = String(v || "").toLowerCase().trim(); if(!s) return null;
  let m = 0, hit = false, x;
  if((x = s.match(/(\d+(?:\.\d+)?)\s*(?:h|hr|hrs|hour|hours)\b/))){ m += parseFloat(x[1]) * 60; hit = true; }
  if((x = s.match(/(\d+)\s*(?:m|min|mins|minute|minutes)\b/))){ m += +x[1]; hit = true; }
  if(!hit && /^\d+$/.test(s)){ m = +s; hit = true; }
  return hit ? Math.round(m) : null;
}
function totalMinutes(r){ const a = parseMinutes(r.prep), b = parseMinutes(r.cook); return a === null && b === null ? null : (a || 0) + (b || 0); }
const lastMade = r => r.cooked.length ? r.cooked[r.cooked.length - 1] : null;

function fmtMins(n){ return n >= 60 ? `${Math.floor(n/60)} hr${n % 60 ? ` ${n % 60} min` : ""}` : `${n} min`; }

/* ---- recipe photos: kept in IndexedDB on this device (localStorage is too small for pictures) ---- */
const PhotoStore = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    try { const rq = indexedDB.open("zendom-photos", 2);
      rq.onupgradeneeded = () => { const db = rq.result; ["photos","pdfs"].forEach(n => { if(!db.objectStoreNames.contains(n)) db.createObjectStore(n); }); };
      rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
    } catch(e){ rej(e); }
  }));
  const tx = (mode, fn, store = "photos") => open().then(db => new Promise((res, rej) => {
    const t = db.transaction(store, mode); const req = fn(t.objectStore(store));
    t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }));
  return { put:(id, data) => tx("readwrite", st => st.put(data, id)), get:id => tx("readonly", st => st.get(id)), del:id => tx("readwrite", st => st.delete(id)),
           putPdf:(id, data) => tx("readwrite", st => st.put(data, id), "pdfs"), getPdf:id => tx("readonly", st => st.get(id), "pdfs"), delPdf:id => tx("readwrite", st => st.delete(id), "pdfs") };
})();
const photoCache = new Map();
function hydratePhotos(){
  document.querySelectorAll("img[data-photo]:not([src])").forEach(img => {
    const id = img.dataset.photo;
    if(photoCache.has(id)){ img.src = photoCache.get(id); return; }
    PhotoStore.get(id).then(d => {
      if(d){ photoCache.set(id, d); document.querySelectorAll(`img[data-photo="${id}"]`).forEach(x => x.src = d); }
      else { const w = img.closest(".thumb,.ph"); if(w) w.classList.add("missing"); }
    }).catch(() => {});
  });
}
function shrinkImage(file){
  return new Promise((res, rej) => {
    if(!file) return rej(new Error("none"));
    if(file.size > 30 * 1024 * 1024) return rej(new Error("big"));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 900, sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("decode")); };
    img.src = url;
  });
}

function recipeMatches(r, rd){
  if(rf.fav && !r.favorite) return false;
  if(rf.types.size && !r.categories.some(c => rf.types.has(c))) return false;
  if(rf.time){ const t = totalMinutes(r); if(t === null || t > rf.time) return false; }
  if(rf.ready && !(rd.total && rd.pct >= rf.ready)) return false;
  const q = recipeQuery.trim().toLowerCase();
  if(!q) return true;
  return r.title.toLowerCase().includes(q) || r.ingredients.some(i => i.toLowerCase().includes(q)) || r.categories.some(c => c.toLowerCase().includes(q));

/* ---- recipe PDFs (e.g. "Print → Save as PDF" from NYT Cooking) ----
   pdf.js (Mozilla, free, open source) is loaded from cdnjs only when a PDF is chosen; the file never leaves the phone. */
const PDFJS_BASE = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
let pdfjsReady = null, pendingPdf = null;
function loadScript(src){ return new Promise((res, rej) => { const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = () => rej(new Error("load")); document.head.appendChild(el); }); }
function loadPdfJs(){
  return pdfjsReady || (pdfjsReady = (async () => {
    if(!window.pdfjsLib) await loadScript(PDFJS_BASE + "pdf.min.js");
    if(!window.pdfjsWorker) await loadScript(PDFJS_BASE + "pdf.worker.min.js");   // runs the parser on the page; artifact pages can't start a cross-site worker
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + "pdf.worker.min.js";
    return window.pdfjsLib;
  })().catch(e => { pdfjsReady = null; throw e; }));
}
// Rebuild reading order from positioned text.
// 1. group text pieces into lines by height on the page
// 2. find a second column by alignment: an x-position where many lines start (e.g. NYT's steps column)
// 3. read the left column top to bottom, then the right column
// 4. inside each column, glue a line onto the next when it runs to the column's edge (it wrapped)
function groupLines(items){
  items.sort((a, b) => b.y - a.y || a.x - b.x);
  const lines = [];
  for(const it of items){
    const L = lines.find(l => Math.abs(l.y - it.y) <= Math.max(2, it.h * 0.45));
    if(L) L.items.push(it); else lines.push({y:it.y, items:[it]});
  }
  lines.sort((a, b) => b.y - a.y);
  return lines.map(l => {
    l.items.sort((a, b) => a.x - b.x);
    let text = "", end = l.items[0].x;
    l.items.forEach(it => { const gap = it.x - end; text += (text && gap > it.h * 0.15 && !/\s$/.test(text) && !/^\s/.test(it.s) ? " " : "") + it.s; end = Math.max(end, it.x + it.w); });
    return {y:l.y, x:l.items[0].x, end, h:Math.max(...l.items.map(i => i.h)), text:text.replace(/\s+/g, " ").trim()};
  }).filter(l => l.text);
}
const LINK_TAIL = /([,(]|\b(and|or|of|for|with|like|such as|plus|into|to|about|the|a|an|finely|roughly|thinly|percent))\s*$/i;
function joinWrapped(lines, edge, colLeft){
  const width = Math.max(40, edge - colLeft), out = [];
  for(const L of lines){
    const p = out[out.length - 1];
    const close = p && (p.y - L.y) <= Math.max(p.h, L.h) * 1.9 && Math.abs(p.h - L.h) <= Math.max(p.h, L.h) * 0.2;   // same font size, next line down
    // it wrapped if the next line's first word wouldn't have fit at the end of this one
    const charW = (L.end - L.x) / Math.max(1, L.text.length);
    const firstWord = (L.text.split(" ")[0] || "").length;
    const reachedEdge = p && (p.end >= edge - width * 0.2 || p.end + charW * (firstWord + 1) > edge);
    const starter = /^(•|[-–*▢☐]\s|step\s*\d+\b|by\s+[A-Z]|[A-Z][A-Z &']{3,}$)/.test(L.text) || /^step\s*\d+\b/i.test(L.text) || QTY_RE.test(L.text) || /^\d+[.)]\s/.test(L.text);
    const prevLabel = p && (/^step\s*\d+[.):]?$/i.test(p.text) || /^[A-Z][A-Z &']{3,}$/.test(p.text));   // "Step 2" or an ALL-CAPS heading
    const capsOk = /^[a-z(]/.test(L.text) || (p && (LINK_TAIL.test(p.text) || /\b[A-Z][a-z]+$/.test(p.text)));
    const lowerCont = close && !starter && !prevLabel && !/[.!?]$/.test(p.text) && (/^[a-z(]/.test(L.text) || (reachedEdge && /^[A-Z][a-z]/.test(L.text) && L.text.length <= 30 && (LINK_TAIL.test(p.text) || /\b[A-Z][a-z]+$/.test(p.text)) && !/^[A-Z][a-z]+\s+(salt|pepper|sugar|flour|oil|butter)\b/i.test(L.text)));
    if(lowerCont || (close && reachedEdge && !starter && !prevLabel && (capsOk || /^•/.test(p.text) || p.para))){
      p.text += " " + L.text; p.end = L.end; p.y = L.y; p.h = L.h;
    } else out.push(Object.assign({}, L, {para: p && p.para && close && !starter ? true : /[a-z]$/.test(L.text) && L.text.length > 50}));
  }
  return out;
}
// Find a second column once for the whole document: the leftmost x (25–75% across) where many lines start.
function findColumn(pages){
  const counts = new Map(); let lines = 0, leftHits = 0;
  pages.forEach((pg, pi) => {
    if(!pg.items.length) return;
    const leftEdge = Math.min(...pg.items.map(i => i.x));
    const ys = new Set(pg.items.map(i => Math.round(i.y))); lines += ys.size;
    leftHits += new Set(pg.items.filter(i => i.x < leftEdge + 8).map(i => Math.round(i.y))).size;
    pg.items.forEach(it => { const k = Math.round(it.x / 4) * 4; if(k > pg.W * 0.25 && k < pg.W * 0.75){ if(!counts.has(k)) counts.set(k, new Set()); counts.get(k).add(pi + ":" + Math.round(it.y)); } });
  });
  let best = 0; counts.forEach(set => { best = Math.max(best, set.size); });
  if(best < 4 || leftHits < 4 || best < lines * 0.2) return null;
  let colX = null; counts.forEach((set, k) => { if(set.size >= Math.max(4, best * 0.5) && (colX === null || k < colX)) colX = k; });
  return colX;
}
// Reading order: every page's left column (title, ingredients, intro, notes), then every page's right column (steps).
function layoutPages(pages){
  const colX = findColumn(pages);
  const L = [], Rt = [];
  // right edge of the left column, measured across the whole document (one page may have only a few lines)
  let leftEndDoc = null;
  if(colX !== null){
    const ends = pages.flatMap(pg => groupLines(pg.items.filter(i => i.x < colX - 3)).filter(l => l.end < colX + 4).map(l => l.end));
    if(ends.length) leftEndDoc = Math.max(...ends);
  }
  pages.forEach(pg => {
    if(!pg.items.length) return;
    const leftEdge = Math.min(...pg.items.map(i => i.x));
    if(colX === null){
      const lines = groupLines(pg.items); L.push(...joinWrapped(lines, Math.max(...lines.map(l => l.end)), leftEdge)); return;
    }
    const left = groupLines(pg.items.filter(i => i.x < colX - 3)), right = groupLines(pg.items.filter(i => i.x >= colX - 3));
    const leftEnd = leftEndDoc !== null ? leftEndDoc : colX - 10;
    if(left.length) L.push(...joinWrapped(left, leftEnd, leftEdge));
    if(right.length) Rt.push(...joinWrapped(right, Math.max(...right.map(l => l.end)), colX));
  });
  return [...L, ...Rt].map(l => l.text).join("\n");
}
async function pdfToText(buf){
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({data:new Uint8Array(buf.slice(0)), isEvalSupported:false, disableFontFace:true}).promise;
  const pages = []; let chars = 0;
  for(let p = 1; p <= Math.min(doc.numPages, 20); p++){
    const page = await doc.getPage(p), vp = page.getViewport({scale:1}), tc = await page.getTextContent();
    const items = tc.items.filter(it => it.str && it.str.trim()).map(it => ({x:it.transform[4], y:it.transform[5], w:it.width, h:Math.abs(it.transform[3]) || 10, s:it.str}));
    chars += items.reduce((a, it) => a + it.s.trim().length, 0);
    pages.push({items, W:vp.width});
  }
  return {text:layoutPages(pages), chars, pages:doc.numPages};
}
async function addRecipeFromPdf(file){
  if(!file) return;
  if(file.size > 15 * 1024 * 1024){ toast("That PDF is over 15 MB. Try saving just the recipe page."); return; }
  const buf = await file.arrayBuffer();
  const head = new TextDecoder().decode(new Uint8Array(buf.slice(0, 1024)));
  if(!head.includes("%PDF")){ toast("That file isn't a PDF."); return; }
  toast("Reading the PDF…");
  let res;
  try { res = await pdfToText(buf); }
  catch(e){ toast(e && e.message === "load" ? "Couldn't load the PDF reader. Check your internet connection and try again." : "That PDF couldn't be opened. It may be damaged or password-protected."); return; }
  if(res.chars < 40){ toast("This PDF is a scanned picture, so its words can't be read. Save the recipe page as a PDF from your browser instead, or paste the text."); return; }
  const pid = "pdf" + uid();
  let saved = true;
  try { await PhotoStore.putPdf(pid, buf); } catch(e){ saved = false; }
  pendingPdf = saved ? {id:pid, name:cutText(file.name || "recipe.pdf", 100)} : null;
  recipeForm(null, false, {text:res.text, fileName:file.name || "recipe.pdf", kept:saved});
}

/* ---- paste-a-recipe parser ----
   Handles text copied from recipe sites and notes: section headings in any case, with colons or
   extra words, junk lines ("Jump to recipe", ratings), split "2 / cups / flour" lines, sub-headings
   ("For the sauce:"), numbered steps, one-long-line pastes, and recipes with no headings at all. */
function parseRecipeText(txt){
  let raw = String(txt || "").replace(/\r/g, "").replace(/ /g, " ");
  if(!/\n/.test(raw.trim())){
    raw = raw.replace(/\s*(ingredients?|instructions?|directions?|method|steps)\s*:?\s+/gi, "\n$1\n")
             .replace(/\s*[•▢☐▪●◦]\s*/g, "\n")
             .replace(/\s+(?=(?:step\s*)?\d+[.)]\s+\S)/gi, "\n");
  }
  const lines = raw.split("\n").map(l => l.trim()).filter(Boolean);
  const out = {title:"", servings:null, prep:"", cook:"", total:"", ingredients:[], steps:[], notes:""};
  const H = {
    ing: /^(ingredients?|what you(?:'|’)?ll need|you(?:'|’)?ll need|you will need|shopping list)\b/i,
    step: /^(instructions?|directions?|method|steps|preparation|how to make(?: it)?|recipe instructions|procedure)\b/i,
    note: /^(notes?|tips?|cook(?:'|’)?s notes?|recipe notes?|private notes|about this recipe|description|introduction|headnote)\b/i,
    skip: /^(nutrition(?: facts| information)?|equipment|video|reviews?|comments?|related(?: recipes)?|you may also like|more recipes)\b/i
  };
  // single throwaway lines (not sections)
  const JUNK = /^(https?:\/\/\S+$|\d{1,2}\/\d{1,2}\/\d{2,4},?\s+\d{1,2}:\d{2}|(page\s*)?\d+\s*(\/|of)\s*\d+$|jump to|skip to|print|pin|save|rate|share|keywords?\s*:|course\s*:|cuisine\s*:|author\s*:|calories\s*:|\d(\.\d)?\s*(from|stars?|out of)|★|☆|\(\d+ (votes|reviews|ratings)\))/i;
  const TIME = "(\\d+\\s*(?:hours?|hrs?|h)\\b(?:,?\\s*(?:and\\s*)?\\d+\\s*(?:minutes?|mins?|m)\\b)?|\\d+\\s*(?:minutes?|mins?|m)\\b)";
  const meta = l => {
    let m, hit = false;
    if(out.servings === null && (m = l.match(/\b(?:serves|servings|serving size|yield|yields|makes)\b\D{0,12}(\d{1,2})\b/i))){ out.servings = +m[1]; hit = true; }
    if(!out.prep && (m = l.match(new RegExp("\\bprep(?:aration)?(?:\\s*time)?\\s*:?\\s*" + TIME, "i")))){ out.prep = m[1].replace(/\s+/g, " "); hit = true; }

    out.notes = rest.filter(l => l.length > 40).slice(0, 3).join("\n");   // keep a short description, drop clutter

  return out;
}

const titleKey = t => String(t || "").toLowerCase().replace(/['‘’`]/g, "").replace(/&/g, " and ").replace(/[^a-z0-9]+/g, " ").trim();

function findDuplicateRecipe(title, source, exceptId){

    if(sk && sourceKey(x.source) === sk) return {r:x, why:"from the same link"};
    if(tk && titleKey(x.title) === tk) return {r:x, why:"with this name"};

}

const LINK_RE = /^https?:\/\/[^\s]+\.[^\s]+$/i;
/* Recipe data in the schema.org format (what the "Copy for zen·dom" Shortcut copies). Mirrors the worker. */
const LD_ENT = {amp:"&", lt:"<", gt:">", quot:'"', apos:"'", nbsp:" ", ndash:"–", mdash:"—", frac12:"½", frac14:"¼", frac34:"¾", deg:"°", rsquo:"’", lsquo:"‘", rdquo:"”", ldquo:"“", hellip:"…"};
function ldClean(t){ return String(t == null ? "" : t).replace(/<[^>]*>/g, " ").replace(/&#x([0-9a-f]+);/gi, (_, h) => String.fromCodePoint(parseInt(h, 16)))
  .replace(/&#(\d+);/g, (_, d) => String.fromCodePoint(+d)).replace(/&([a-z0-9]+);/gi, (m, n) => LD_ENT[n.toLowerCase()] ?? m).replace(/\s+/g, " ").trim(); }

function ldFind(node, depth = 0){
  if(!node || typeof node !== "object" || depth > 6) return null;
  if(Array.isArray(node)){ for(const x of node){ const r = ldFind(x, depth + 1); if(r) return r; } return null; }
  if(ldIs(node, "Recipe")) return node;
  for(const k of ["recipe", "@graph", "mainEntity", "mainEntityOfPage", "itemListElement"]){ const r = ldFind(node[k], depth + 1); if(r) return r; }
  return null;
}
function ldSteps(ins, out = []){
  if(!ins) return out;
  if(typeof ins === "string"){ ldClean(ins).split(/(?<=\.)\s+(?=[A-Z])/).forEach(x => x.trim() && out.push(x.trim())); return out; }
  if(Array.isArray(ins)){ ins.forEach(x => ldSteps(x, out)); return out; }
  if(ldIs(ins, "HowToSection")){ if(ins.name) out.push(ldClean(ins.name).toUpperCase() + ":"); return ldSteps(ins.itemListElement, out); }

// Pasted text -> {title, servings, prep, cook, ingredients, steps, notes, source} or null if it isn't recipe data.
function recipeFromPastedData(txt){
  if(!/^[\[{]/.test(txt)) return null;
  let o; try { o = JSON.parse(txt); } catch(e){ return null; }
  const r = ldFind(o); if(!r) return null;

// A pasted web link: ask the zen·dom worker to read the recipe off the page.
async function readRecipeLink(url){
  const status = $("#pasteStatus"), say = t => { if(status) status.textContent = t; };
  let host = ""; try { host = new URL(url).hostname.replace(/^www\./, ""); } catch(e){}
  const set = (id, v) => { const el = $("#" + id); if(el && v){ el.value = v; el.classList.add("filled"); } };
  set("source", url.slice(0, 500));
  if(!NOTIFY.url || !window.zdBackend || !sync.user){ say(`Reading links needs you signed in (More → Settings). For now, copy the recipe text from ${host || "the page"} and paste it here.`); return; }
  say(`Reading the recipe from ${host}…`); readRecipeLink.busy = url;
  let j = null, err = "";
  try {
    const idToken = await window.zdBackend.idToken();
    const res = await fetch(NOTIFY.url.replace(/\/$/, "") + "/recipe", {method:"POST", headers:{"Content-Type":"text/plain"}, body: JSON.stringify({idToken, url})});
    j = await res.json().catch(() => null);
    if(!res.ok) err = (j && j.error) || "the site didn't answer";
  } catch(e){ err = navigator.onLine === false ? "you're offline" : "couldn't reach the recipe reader"; }
  if(readRecipeLink.busy !== url || !$("#paste")) return;            // the sheet closed or another link was pasted
  readRecipeLink.busy = null;
  if(err || !j){ say(`Couldn't read that link (${err}). Copy the recipe text from the page and paste it here instead.`); return; }
  if(!j.found){ set("rtitle", (j.title || "").slice(0, 100)); say(`${host} doesn't share its recipe in a form the app can read. Copy the ingredients and steps from the page and paste them here; the link is saved below.`); return; }
  set("rtitle", (j.title || "").slice(0, 100));
  if(j.servings) set("servings", String(Math.min(99, j.servings)));
  set("prep", (j.prep || "").slice(0, 20)); set("cook", (j.cook || "").slice(0, 20));
  set("ings", (j.ingredients || []).join("\n")); set("steps", (j.steps || []).join("\n")); set("rnotes", (j.notes || "").slice(0, 2000));
  const box = $("#paste"); if(box) box.value = "";
  const ni = (j.ingredients || []).length, ns = (j.steps || []).length;
  say(`Got it from ${host}: ${ni} ingredient${ni === 1 ? "" : "s"} and ${ns} step${ns === 1 ? "" : "s"}. Check them below, then Save.`);
  const t = $("#rtitle"); if(t) t.scrollIntoView({block:"start", behavior:"smooth"});
}
function fillFromPaste(auto){
  const box = $("#paste"); if(!box) return;
  const txt = box.value.trim();
  const status = $("#pasteStatus");
  if(!txt){ fail("paste", "Paste some recipe text or a link first."); return; }
  if(LINK_RE.test(txt)){ readRecipeLink(txt); return; }
  const ld = recipeFromPastedData(txt);
  if(ld){
    const set = (id, v) => { const el = $("#" + id); if(el && v){ el.value = v; el.classList.add("filled"); } };
    set("rtitle", ld.title); if(ld.servings) set("servings", String(ld.servings)); set("prep", ld.prep.slice(0, 20)); set("cook", ld.cook.slice(0, 20));
    set("ings", ld.ingredients.map(x => x.slice(0, 200)).join("\n")); set("steps", ld.steps.map(x => x.slice(0, 1000)).join("\n")); set("rnotes", ld.notes); set("source", ld.source.slice(0, 500));
    box.value = "";
    let host = ""; try { host = ld.source ? new URL(ld.source).hostname.replace(/^www\./, "") : ""; } catch(e){}
    if(status) status.textContent = `Got it${host ? " from " + host : ""}: ${ld.ingredients.length} ingredient${ld.ingredients.length === 1 ? "" : "s"} and ${ld.steps.length} step${ld.steps.length === 1 ? "" : "s"}. Check them below, then Save.`;
    const t = $("#rtitle"); if(t) t.scrollIntoView({block:"start", behavior: auto ? "smooth" : "auto"});
    return;
  }
  if(/^[\[{]/.test(txt) && /"@type"/.test(txt)){ if(status) status.textContent = "That copied page didn't have a recipe in it. Make sure the recipe itself is open in Safari, then run the Shortcut again."; return; }
  const p = parseRecipeText(txt);
  const set = (id, v) => { const el = $("#" + id); if(el && v){ el.value = v; el.classList.add("filled"); } };
  set("rtitle", p.title.slice(0, 100));
  if(p.servings) set("servings", String(Math.min(99, p.servings)));
  set("prep", p.prep.slice(0, 20)); set("cook", (p.cook || (!p.prep && p.total) || "").slice(0, 20));
  set("ings", p.ingredients.join("\n")); set("steps", p.steps.join("\n")); set("rnotes", p.notes.slice(0, 2000));
  const found = p.ingredients.length || p.steps.length;
  if(status) status.textContent = found ? `Found ${p.ingredients.length} ingredient${p.ingredients.length===1?"":"s"} and ${p.steps.length} step${p.steps.length===1?"":"s"}. Check them below, then Save.` : "Couldn't tell ingredients from steps. The text went into Notes, so you can sort it by hand.";
  if(!found && !p.notes) set("rnotes", txt.slice(0, 2000));
  const t = $("#rtitle"); if(t && found) t.scrollIntoView({block:"start", behavior: auto ? "smooth" : "auto"});
}

    ${field("mcomment", m && m.comments.length ? "Add a comment" : "Comment", `<textarea id="mcomment" name="mcomment" maxlength="300" placeholder="I'll cook! · Can we do 7 instead? · Need anything from the store?"></textarea>`, "Optional. Saved with the meal.")}
    ${footer(m ? "delMeal:" + m.id : "")}`,
  form => {
    const date = val(form,"mdate"), slot = val(form,"slot"), rid = val(form,"mrecipe"), text = val(form,"mtext");
    if(!isDate(date)) return fail("mdate","Pick a valid day.");
    if(!SLOTS[slot]) return fail("slot","Pick a meal.");
    if(rid && !state.recipes.some(r => r.id === rid)) return fail("mrecipe","That recipe no longer exists.");
    if(!rid && !text) return fail("mtext","Pick a recipe or write a short note.");
    const data = {date, slot, recipeId: rid || null, text};
    const note = form.elements.mcomment.value.trim().slice(0, 300);
    const target = m ? Object.assign(m, data) : Object.assign({id:uid(), comments:[]}, data);
    if(!Array.isArray(target.comments)) target.comments = [];
    if(!m) state.meals.push(target);
    if(note) target.comments.push({id:uid(), by:prefs.user, text:note, at:Date.now()});
    planWeek = weekStart(date);
    save(); closeSheet(); render(); toast(note ? "Comment added" : m ? "Meal saved" : `Planned for ${parse(date).toLocaleDateString(undefined,{weekday:"long"})}`);
  });
}

function groceryForm(id){
  const g = state.grocery.find(x => x.id === id); if(!g) return;
  openSheet("Edit item", `
    ${field("gname2","Item", `<input id="gname2" name="gname2" maxlength="80" value="${esc(g.name)}">`)}
    <div class="two">${field("gqty","Amount", `<input id="gqty" name="gqty" maxlength="60" value="${esc(g.qty)}" placeholder="Optional">`)}
    ${field("gaisle","Aisle", `<select id="gaisle" name="gaisle">${AISLES.map(a => `<option ${g.aisle===a?"selected":""}>${esc(a)}</option>`).join("")}</select>`)}</div>
    ${footer("delGrocery:" + g.id)}`,
  form => {
    const name = val(form,"gname2"); if(!name) return fail("gname2","The item needs a name.");
    const aisle = val(form,"gaisle");
    Object.assign(g, {name, qty:val(form,"gqty"), aisle: AISLES.includes(aisle) ? aisle : "Other"});
    save(); closeSheet(); render(); toast("Item saved");
  });
}

function pantryForm(id){
  const p = id ? state.pantry.find(x => x.id === id) : null; if(id && !p) return;
  const room = ROOMS[prefs.pantryRoom] ? prefs.pantryRoom : "fridge";
  const d = p || {name:"", qty:"", room, expires:""};
  openSheet(p ? "Edit pantry item" : `Add to ${ROOMS[room]}`, `
    ${field("pname","Item", `<input id="pname" name="pname" maxlength="80" value="${esc(d.name)}" autocomplete="off">`)}
    <div class="two">${field("pqty","Amount", `<input id="pqty" name="pqty" maxlength="60" value="${esc(d.qty)}" placeholder="Optional">`)}
    ${field("proom","Where", `<select id="proom" name="proom">${Object.entries(ROOMS).map(([k,l]) => `<option value="${k}" ${d.room===k?"selected":""}>${l}</option>`).join("")}</select>`)}</div>
    ${field("pexp","Use by", `<input id="pexp" name="pexp" type="date" value="${esc(d.expires)}">`, "Optional. Items close to this date show on Today.")}
    ${p ? `<button type="button" class="btn ghost small" data-act="pantryToGrocery" data-id="${p.id}" style="align-self:flex-start">Running low: add to groceries</button>` : ""}
    ${footer(p ? "delPantry:" + p.id : "")}`,
  form => {
    const name = val(form,"pname"), exp = val(form,"pexp"), rm = val(form,"proom");
    if(!name) return fail("pname","The item needs a name.");
    if(exp && !isDate(exp)) return fail("pexp","Pick a valid date or leave it blank.");
    if(!ROOMS[rm]) return fail("proom","Pick where it lives.");
    const data = {name, qty:val(form,"pqty"), room:rm, expires:exp};
    const same = p && normName(p.name) === normName(name) ? null : state.pantry.find(x => x !== p && normName(x.name) === normName(name));
    if(same && warnDuplicate(form, "pname", same.id, `“${same.name}” is already in ${ROOMS[same.room]}${same.qty ? ` (${same.qty})` : ""}. Tap Save again to add a second entry.`, "openDupPantry", same.id)) return;
    if(p){ Object.assign(p, data); p.example = false; } else state.pantry.push(Object.assign({id:uid(), example:false}, data));
    prefs.pantryRoom = rm; savePrefs();
    if(prefs.tab === "kitchen" && prefs.pantryRoom !== rm){ prefs.pantryRoom = rm; savePrefs(); }
    save(); closeSheet(); render(); toast(p ? "Saved" : `Added to ${ROOMS[rm]}`);
  });
}

function parseMoney(v){
  const s = String(v || "").replace(/[$,\s]/g, "");
  if(!/^\d+(\.\d{1,2})?$/.test(s) && !/^\.\d{1,2}$/.test(s)) return null;
  const c = Math.round(parseFloat(s) * 100);
  return c > 0 && c <= 100000000 ? c : null;
}

/* ============================================================
   CSV IMPORT: Venmo statements and bank / card exports
   Everything is read in the browser; nothing is uploaded.
   ============================================================ */
function parseCSV(text){
  const rows = []; let row = [], cell = "", q = false;
  text = String(text || "").replace(/^﻿/, "");
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){
      if(ch === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if(ch === '"') q = true;
    else if(ch === ","){ row.push(cell); cell = ""; }
    else if(ch === "\n" || ch === "\r"){ if(ch === "\r" && text[i+1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if(cell !== "" || row.length){ row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(c => c));
}
// "2026-10-03T14:22:01", "10/03/2026", "10/3/26", "2026/10/03" -> "YYYY-MM-DD" (US month-first for slashes)
function csvDate(s){
  s = String(s || "").trim(); let m;
  if((m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/))) { const d = `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`; return isDate(d) ? d : null; }
  if((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})\b/))){ const y = m[3].length === 2 ? 2000 + +m[3] : +m[3]; const d = `${y}-${pad(+m[1])}-${pad(+m[2])}`; return isDate(d) ? d : null; }
  return null;
}
// "- $25.00", "+ $40.00", "(12.00)", "-1,234.56", "$9.99" -> signed cents (null if not a number)
function csvAmount(s){
  s = String(s || "").trim(); if(!s) return null;
  const neg = /^\(.*\)$/.test(s) || /^-|^\$?\s*-|-\s*\$/.test(s.replace(/\s+/g, " "));
  const n = s.replace(/[^0-9.]/g, "");
  if(!/^\d*\.?\d+$/.test(n)) return null;
  const c = Math.round(parseFloat(n) * 100);
  return neg ? -c : c;
}
const H = {
  date: /^(date|datetime|transaction date|trans\.? date|posted date|posting date|post date)$/i,
  desc: /^(description|payee|merchant|name|memo|details|transaction description|original description)$/i,
  note: /^note$/i,
  amount: /^(amount|amount \(total\)|transaction amount|amount \(usd\))$/i,
  debit: /^(debit|debits|withdrawal|withdrawals|money out|debit amount)$/i,
  credit: /^(credit|credits|deposit|deposits|money in|credit amount)$/i,
  from: /^from$/i, to: /^to$/i, status: /^status$/i, type: /^(type|transaction type)$/i
};
function detectColumns(rows){
  for(let i = 0; i < Math.min(rows.length, 15); i++){
    const r = rows[i], find = re => r.findIndex(c => re.test(c));
    const map = {}; Object.keys(H).forEach(k => map[k] = find(H[k]));
    if(map.date >= 0 && (map.amount >= 0 || map.debit >= 0 || map.credit >= 0)){
      const venmo = map.from >= 0 && map.to >= 0 && r.some(c => /^amount \(total\)$/i.test(c));
      return {header:i, map, fmt: venmo ? "venmo" : "bank"};
    }
  }
  return null;
}

const cleanNote = s => String(s || "").replace(/:[a-z0-9]+(?:_[a-z0-9]+)*_?:?/gi, m => /_/.test(m) || /:$/.test(m) ? "" : m).replace(/\s+/g, " ").trim();

  const d = String(display || "").toLowerCase();

function impKey(date, cents, desc){ return `${date}|${cents}|${String(desc).toLowerCase().replace(/\s+/g, " ").slice(0, 40)}`; }
function buildImport(text, fileName){
  const rows = parseCSV(text);
  if(!rows.length) return {error:"That file is empty."};
  const det = detectColumns(rows);
  if(!det) return {error:"Couldn't find Date and Amount columns. Make sure it's the CSV export from your bank or Venmo, not a PDF statement."};
  const {map, fmt} = det;
  const parties = new Map();
  const out = [];
  rows.slice(det.header + 1).forEach((r, i) => {
    const date = csvDate(r[map.date]);
    let cents = null;
    if(map.amount >= 0) cents = csvAmount(r[map.amount]);
    else { const d = csvAmount(r[map.debit]), c = csvAmount(r[map.credit]); if(d) cents = -Math.abs(d); else if(c) cents = Math.abs(c); }
    if(!date || !cents) return;                                   // footers, summaries, blank lines
    if(fmt === "venmo"){
      const status = map.status >= 0 ? r[map.status] : "", type = map.type >= 0 ? r[map.type] : "";
      if(status && !/complete|issued/i.test(status)) return;       // pending, failed, cancelled
      if(/transfer/i.test(type)) return;                           // moving your own money to/from the bank
    }
    const counterparty = fmt === "venmo" ? (cents < 0 ? r[map.to] : r[map.from]) || "" : "";
    if(counterparty) parties.set(counterparty, (parties.get(counterparty) || 0) + 1);
    const note = cleanNote(map.note >= 0 ? r[map.note] : "");
    let desc;
    if(fmt === "venmo"){ const cp = counterparty ? " · " + counterparty : ""; desc = cutText(note, 80 - Array.from(cp).length) + cp; }
    else desc = cutText(r[map.desc] || note || "", 80);
    desc = desc.replace(/^ · /, "") || "Imported";
    const from = fmt === "venmo" ? r[map.from] || "" : "", to = fmt === "venmo" ? r[map.to] || "" : "";

  const manual = state.budget.txns.filter(t => !t.imp);
  out.forEach(x => {
    x.key = impKey(x.date, x.cents, x.desc);
    if(keys.has(x.key)){ x.dup = "Already imported"; x.include = false; }
    else if(manual.some(t => t.date === x.date && t.amount === Math.abs(x.cents))){ x.dup = "Might match an entry you typed"; x.include = false; }

function rowKind(x){

/* ============================================================
   CALENDAR: week ahead + month snapshot
   Pulls chores, meals, bills, checkups, birthdays, use-by dates and custom events
   into one view. Only custom events are stored separately (state.events).
   ============================================================ */
const EV_TYPES = {
  holiday:{label:"Holidays", cls:"t-holiday"}, chore:{label:"Chores", cls:"t-chore"}, meal:{label:"Meals", cls:"t-meal"}, bill:{label:"Bills", cls:"t-bill"},
  health:{label:"Health", cls:"t-health"}, bday:{label:"Birthdays", cls:"t-bday"}, event:{label:"Events", cls:"t-event"}, pantry:{label:"Use by", cls:"t-pantry"}
};
/* US federal holidays (5 U.S.C. 6103). A Saturday holiday is observed the Friday before,
   a Sunday one the Monday after (OPM). Inauguration Day is DC-area only, so it's left out. */
function nthWeekday(y, m, dow, n){            // m 1-12, dow 0=Sun, n=-1 for last
  if(n < 0){ const d = new Date(y, m, 0); d.setDate(d.getDate() - ((d.getDay() - dow + 7) % 7)); return toStr(d); }
  const d = new Date(y, m - 1, 1); d.setDate(1 + ((dow - d.getDay() + 7) % 7) + 7 * (n - 1)); return toStr(d);
}
function federalHolidays(y){
  const fixed = (m, d, name) => { const dt = new Date(y, m - 1, d), w = dt.getDay(), actual = toStr(dt);
    if(w === 6) dt.setDate(d - 1); else if(w === 0) dt.setDate(d + 1);
    const obs = toStr(dt); return {date: obs, name, note: obs !== actual ? `Observed · actual day is ${parse(actual).toLocaleDateString(undefined,{weekday:"long"})}` : ""}; };
  return [
    fixed(1, 1, "New Year's Day"),
    {date: nthWeekday(y, 1, 1, 3), name: "Martin Luther King Jr. Day"},
    {date: nthWeekday(y, 2, 1, 3), name: "Washington's Birthday"},
    {date: nthWeekday(y, 5, 1, -1), name: "Memorial Day"},
    fixed(6, 19, "Juneteenth"),
    fixed(7, 4, "Independence Day"),
    {date: nthWeekday(y, 9, 1, 1), name: "Labor Day"},
    {date: nthWeekday(y, 10, 1, 2), name: "Columbus Day"},
    fixed(11, 11, "Veterans Day"),
    {date: nthWeekday(y, 11, 4, 4), name: "Thanksgiving"},
    fixed(12, 25, "Christmas Day")

}
const EV_REPEAT = {none:"Doesn't repeat", weekly:"Every week", monthly:"Every month", yearly:"Every year"};
let calWeek = null, calMonth = null, calDay = null;      // device-only view state
const curCalWeek = () => calWeek || (calWeek = todayStr());
const curCalMonth = () => calMonth || (calMonth = todayStr().slice(0, 7));
// The day a new event should start on: the selected day in Month, the first day you can see in Week
// (today if today is on screen).
function calDefaultDay(){
  const t = todayStr();
  if(prefs.todayView === "month"){ const k = curCalMonth(); return calDay && calDay.slice(0, 7) === k ? calDay : (t.slice(0, 7) === k ? t : k + "-01"); }
  if(prefs.todayView === "week"){ const ws = curCalWeek(); return t >= ws && t <= addDays(ws, 6) ? t : ws; }
  return t;
}
// Every calendar item between from and to (inclusive), as {date, type, title, who, act, id, time, flag}
function calendarItems(from, to){
  const out = [], t = todayStr();
  const push = (date, o) => { if(date >= from && date <= to) out.push(Object.assign({date}, o)); };
  const project = (first, kind, n, o, anchorDay) => { let d = first; for(let k = 1; d <= to && k < 5000; k++){ push(d, o); d = nthRepeat(first, kind, n, k, anchorDay); } };
  // chores: overdue ones sit on today; repeats are projected forward from the next due date
  state.chores.forEach(c => {
    const o = {type:"chore", title:c.title, who:c.owner || "", act:"editChore", id:c.id};
    if(c.freq === "once"){ if(!c.done) push(c.start < t ? t : c.start, Object.assign({}, o, c.start < t ? {flag:"overdue"} : {})); return; }
    let due = nextDue(c);
    if(due < t){ push(t, Object.assign({}, o, {flag:"overdue"})); due = nthRepeat(t, c.freq, c.everyDays, 1); }
    project(due, c.freq, c.everyDays, o);
  });

  state.budget.bills.forEach(b => project(b.nextDue, b.cycle, 0, {type:"bill", title:`${b.name} · ${money(b.amount)}`, who: b.shared ? "" : b.paidBy, act:"editBill", id:b.id}, b.anchorDay));

    const p = state.people[k];
    p.checkups.forEach(c => { const i = checkupInfo(c); if(i.due) push(i.due < t ? t : i.due, {type:"health", title:`${p.name}: ${c.name}${i.booked ? "" : " (due)"}`, who: HUMANS.includes(k) ? k : "", act:"goFam", id:k, time: i.booked && i.due >= t ? c.next.time : "", flag: i.due < t ? "overdue" : ""}); });
    p.vaccines.forEach(v => { if(v.nextDue) push(v.nextDue < t ? t : v.nextDue, {type:"health", title:`${p.name}: ${v.name} booster`, who: HUMANS.includes(k) ? k : "", act:"goFam", id:k, flag: v.nextDue < t ? "overdue" : ""}); });
    if(p.birthday){
      for(let y = +from.slice(0, 4); y <= +to.slice(0, 4); y++){
        let d = `${y}-${p.birthday.slice(5)}`;
        if(!isDate(d)) d = `${y}-02-28`;                            // Feb 29 birthdays in non-leap years
        const age = y - +p.birthday.slice(0, 4);
        push(d, {type:"bday", title:`${p.name}'s birthday${age > 0 && p.kind !== "cat" ? ` (${age})` : age > 0 ? ` (turns ${age})` : ""}`, who: HUMANS.includes(k) ? k : "", act:"goFam", id:k});
      }
    }
  });
  state.pantry.forEach(p => { if(p.expires) push(p.expires, {type:"pantry", title:`Use up: ${p.name}`, who:"", act:"goKitchen", id:"pantry"}); });
  state.events.forEach(e => {
    const o = {type:"event", title:e.title, who:e.who, act:"editEvent", id:e.id, time:e.time};
    if(e.repeat === "none") push(e.date, o);
    else project(e.date, e.repeat, 0, o);
  });
  if(state.settings.holidays !== "off"){
    // New Year's on a Saturday is observed Dec 31 of the year before, so look one year ahead
    for(let y = +from.slice(0, 4); y <= +to.slice(0, 4) + 1; y++)
      federalHolidays(y).forEach(h => push(h.date, {type:"holiday", title: h.name + (h.note ? ` (observed)` : ""), who:"", act:"holidayInfo", id: h.note || "Federal holiday"}));
  }
  const typeOrder = Object.keys(EV_TYPES);
  const who = prefs.calWho || "all";
  return out.filter(x => who === "all" || !x.who || x.who === who)
    .sort((a, b) => a.date.localeCompare(b.date) || (a.flag === "overdue" ? -1 : 0) - (b.flag === "overdue" ? -1 : 0) || String(a.time || "99").localeCompare(String(b.time || "99")) || typeOrder.indexOf(a.type) - typeOrder.indexOf(b.type) || (a.order || 0) - (b.order || 0) || a.title.localeCompare(b.title));
}
function fmtTime(t){ if(!t) return ""; const [h, m] = t.split(":").map(Number); return new Date(2000, 0, 1, h, m).toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"}); }

function viewMonth(){
  const k = curCalMonth(), [y, m] = k.split("-").map(Number), t = todayStr();

/* ---- "Add to my calendar": one-time copies into Google, Outlook or any calendar app ----
   Timed events last an hour. Google and the .ics file keep weekly/monthly/yearly repeats; Outlook's link can't. */
const CAL_RRULE = {weekly:"FREQ=WEEKLY", monthly:"FREQ=MONTHLY", yearly:"FREQ=YEARLY"};
function calTimes(e){
  if(!e.time) return {allDay:true, start:e.date, end:addDays(e.date, 1)};
  const [y, m, d] = e.date.split("-").map(Number), [hh, mm] = e.time.split(":").map(Number);
  const a = new Date(y, m - 1, d, hh, mm), b = new Date(a.getTime() + 3600000);
  return {allDay:false, a, b};
}
const calZ = dt => dt.toISOString().replace(/\.\d{3}Z$/, "Z");                    // 2026-10-29T17:30:00Z
const calCompact = s => s.replace(/[-:]/g, "");                                    // 20261029T173000Z
function calDetails(e){ return [e.note, "From zen·dom"].filter(Boolean).join("\n\n"); }
function googleCalUrl(e){
  const t = calTimes(e), q = new URLSearchParams({action:"TEMPLATE", text:e.title, details:calDetails(e)});
  q.set("dates", t.allDay ? `${t.start.replace(/-/g, "")}/${t.end.replace(/-/g, "")}` : `${calCompact(calZ(t.a))}/${calCompact(calZ(t.b))}`);
  if(CAL_RRULE[e.repeat]) q.set("recur", "RRULE:" + CAL_RRULE[e.repeat]);
  return "https://calendar.google.com/calendar/render?" + q.toString();
}
function outlookCalUrl(e, host){
  const t = calTimes(e), q = new URLSearchParams({path:"/calendar/action/compose", rru:"addevent", subject:e.title, body:calDetails(e)});
  if(t.allDay){ q.set("startdt", t.start); q.set("enddt", t.end); q.set("allday", "true"); }
  else { q.set("startdt", calZ(t.a)); q.set("enddt", calZ(t.b)); q.set("allday", "false"); }
  return `https://${host}/calendar/0/deeplink/compose?` + q.toString();
}
function icsText(e){
  const t = calTimes(e), esc = v => String(v).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
  const fold = line => { const out = []; let cur = ""; for(const ch of line){ if(new TextEncoder().encode(cur + ch).length > 74){ out.push(cur); cur = " " + ch; } else cur += ch; } out.push(cur); return out.join("\r\n"); };
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//zen-dom//household app//EN", "CALSCALE:GREGORIAN", "BEGIN:VEVENT",
    `UID:${e.id}@zendom`, `DTSTAMP:${calCompact(calZ(new Date()))}`,
    t.allDay ? `DTSTART;VALUE=DATE:${t.start.replace(/-/g, "")}` : `DTSTART:${calCompact(calZ(t.a))}`,
    t.allDay ? `DTEND;VALUE=DATE:${t.end.replace(/-/g, "")}` : `DTEND:${calCompact(calZ(t.b))}`,
    `SUMMARY:${esc(e.title)}`, `DESCRIPTION:${esc(calDetails(e))}`];
  if(CAL_RRULE[e.repeat]) lines.push("RRULE:" + CAL_RRULE[e.repeat]);
  lines.push("END:VEVENT", "END:VCALENDAR");
  return lines.map(fold).join("\r\n") + "\r\n";
}
function apptEvent(p, c){ return {id:"appt~" + c.id, title:`${p.name}: ${c.name}`, date:c.next.date, time:c.next.time, repeat:"none", note:[c.next.where, c.provider].filter(Boolean).join(" · ")}; }
function calEventById(id){
  if(!String(id).startsWith("appt~")) return state.events.find(x => x.id === id) || null;
  const cid = id.slice(5);
  for(const k of PEOPLE){ const c = state.people[k].checkups.find(x => x.id === cid); if(c && c.next) return apptEvent(state.people[k], c); }
  return null;
}

// Does an event title sound like a health visit? Returns {name, who} or null. Plain word matching:
// it will miss some and wrongly suggest others, which is why it always asks.
const HEALTH_WORDS = [
  [/\b(vet|vets|veterinar\w*)\b/i, "Wellness exam", "paprika"],
  [/\b(dentist|dental|teeth|hygienist|orthodont\w*)\b/i, "Dentist cleaning"],
  [/\b(eye exam|eye doctor|optometr\w*|ophthalm\w*|vision)\b/i, "Eye exam"],
  [/\b(derm|dermatolog\w*|skin check)\b/i, "Dermatology"],
  [/\b(physical|annual exam|check-?up|wellness visit|primary care|pcp)\b/i, "Physical"],
  [/(\bdr\.?\s|\bdoctor\b|\bclinic\b|\bob-?gyn\b|\bgyn\w*|\burgent care\b|\blab work\b|\bblood ?work\b|\bx-?ray\b|\bmri\b|\bspecialist\b|\bphysio\w*|\bcardiolog\w*|\baudiolog\w*|\bdermatolog\w*)/i, ""]
];
function healthGuess(title){
  const t = String(title || "");
  for(const [re, name, who] of HEALTH_WORDS){ if(re.test(t)) return {name: name || t.replace(/\s+/g, " ").trim().slice(0, 80), who: who || null}; }
  return null;
}
const sameName = (a, b) => a.toLowerCase().replace(/['’]/g, "").trim() === b.toLowerCase().replace(/['’]/g, "").trim();
function healthPrompt(eventId){
  const ev = state.events.find(x => x.id === eventId); if(!ev) return;

  const who = g.who || named || ev.who || prefs.user;
  const upcoming = ev.date >= todayStr() && !(ev.date === todayStr() && ev.time && ev.time < new Date().toTimeString().slice(0, 5));
  const when = parse(ev.date).toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});

    <p style="margin:0">“${esc(ev.title)}” on ${esc(when)} sounds like a health visit.</p>
    <div class="field"><span class="lab">Whose?</span><div class="seg" role="radiogroup">${PEOPLE.map(k => `<label class="chip" style="cursor:pointer"><input type="radio" name="hwho" value="${k}" ${who === k ? "checked" : ""}> ${esc(nameOf(k))}</label>`).join("")}</div></div>
    ${field("hname", "Kind of visit", `<input id="hname" name="hname" maxlength="80" value="${esc(g.name)}" autocomplete="off">`, upcoming ? "It becomes the booked appointment for this checkup, and stays on the calendar." : "It's logged as their last visit.")}
    <div class="actions"><span></span><div class="r"><button type="button" class="btn ghost" data-act="closeSheet">Not now</button><button type="submit" class="btn">Add</button></div></div>`,
  form => {
    const k = (form.querySelector("input[name=hwho]:checked") || {}).value, name = val(form, "hname");
    if(!PEOPLE.includes(k)) return fail("hname", "Pick whose visit it is.");
    if(!name) return fail("hname", "Name the visit, like Dentist cleaning.");
    const p = state.people[k], before = JSON.stringify(p.checkups), evBefore = JSON.stringify(state.events);
    let c = p.checkups.find(x => sameName(x.name, name));
    if(!c){ c = {id:uid(), name, months:12, last:"", provider:"", next:null}; p.checkups.push(c); }
    let msg;
    if(upcoming){
      c.next = {date: ev.date, time: ev.time, where: (ev.note || "").slice(0, 120)};
      removeBy(state.events, ev.id);
      msg = `Booked in ${p.name}'s health history`;

    }
    save(); closeSheet(); render();
    toast(msg, () => { p.checkups = JSON.parse(before); state.events = JSON.parse(evBefore); save(); render(); });
  }, false);
}

/* ============================================================
   PLAN (YNAB-style): give every dollar a job, month by month
   budget.plan["YYYY-MM"][categoryId] = assigned cents. A category's default
   monthly target (its "limit") fills months you haven't touched yet.
   ============================================================ */
function assignedFor(k, catId){
  const m = state.budget.plan[k];
  if(m && Object.prototype.hasOwnProperty.call(m, catId)) return m[catId];
  const c = state.budget.categories.find(x => x.id === catId); return c ? c.limit : 0;
}
const lim = (c, k) => assignedFor(k, c.id);
function setAssigned(k, catId, cents){
  if(!state.budget.plan[k]) state.budget.plan[k] = {};
  state.budget.plan[k][catId] = Math.max(0, Math.round(cents));
}
function planStats(k){
  const st = monthStats(k);
  const assigned = state.budget.categories.reduce((a, c) => a + lim(c, k), 0);
  return Object.assign(st, {assigned, ready: st.income - assigned});
}
function trueExpenses(){
  return state.budget.bills.filter(b => b.cycle === "yearly").map(b => ({b, monthly: Math.ceil(b.amount / 12)}));
}

/* ============================================================
   FUN FUND: Jeff's ledger. Who put what in, where it's kept, what it paid for,
   and shared goals. Not tied to chores.
   ============================================================ */
const fund = () => state.budget.fund;
function fundPlaces(){
  const bal = {};
  fund().entries.forEach(e => {
    if(e.kind === "in") bal[e.place] = (bal[e.place] || 0) + e.amount;
    else if(e.kind === "out") bal[e.place] = (bal[e.place] || 0) - e.amount;
    else if(e.kind === "move"){ bal[e.place] = (bal[e.place] || 0) - e.amount; bal[e.toPlace] = (bal[e.toPlace] || 0) + e.amount; }
  });

// Paprika's little routine: a list of steps, played on a loop. Mood changes the routine.
function rmPapPlan(mood){
  const bed = {x:22, y:48}, laundry = {x:38, y:55};
  const walk = (x, y) => ({do:"walk", x, y});
  if(mood === "grumpy") return [{do:"teleport", ...laundry}, {do:"sleep", t:9000, bub:"z", z:6}, {do:"sleep", t:2500, bub:"bang", z:6}];
  if(mood === "sideeye") return [{do:"teleport", ...bed}, {do:"sleep", t:5000, bub:"z"}, walk(40, 58), walk(78, 59), {do:"sit", t:5000, face:-1, bub:"dots"}, walk(40, 58), walk(bed.x, bed.y)];
  if(mood === "happy") return [{do:"teleport", ...bed}, {do:"sleep", t:4000}, walk(40, 58), walk(80, 59), {do:"sit", t:3000, bub:"heart"}, walk(108, 54), walk(113, 40), {do:"sit", t:4000, bub:"note"}, walk(108, 54), walk(60, 59), walk(bed.x, bed.y)];
  return [{do:"teleport", ...bed}, {do:"sleep", t:7000, bub:"z"}, walk(40, 58), walk(84, 59), {do:"sit", t:4500}, walk(40, 58), walk(bed.x, bed.y)];
}
const RM_SPEED = .012;                             // world units per ms
function rmPapAt(plan, ms){
  // walk the plan forward until we reach `ms` into the loop
  let x = plan[0].x, y = plan[0].y, t = 0;
  const steps = plan.map(s => {
    if(s.do === "teleport"){ x = s.x; y = s.y; return {s, dur:0, x0:x, y0:y, x1:x, y1:y}; }
    if(s.do === "walk"){ const d = Math.hypot(s.x - x, s.y - y), o = {s, dur:Math.max(1, d / RM_SPEED), x0:x, y0:y, x1:s.x, y1:s.y}; x = s.x; y = s.y; return o; }
    return {s, dur:s.t, x0:x, y0:y, x1:x, y1:y};
  });
  const total = steps.reduce((a, o) => a + o.dur, 0);
  let m = ms % total; void t;
  for(const o of steps){ if(m < o.dur){ const f = m / o.dur; return {step:o.s, x:o.x0 + (o.x1 - o.x0) * f, y:o.y0 + (o.y1 - o.y0) * f, dx:o.x1 - o.x0, dy:o.y1 - o.y0, m, dur:o.dur}; } m -= o.dur; }
  const o = steps[steps.length - 1]; return {step:o.s, x:o.x1, y:o.y1, dx:0, dy:0, m:0, dur:1};
}
let rmLastFace = 1;
function rmDrawPaprika(B, p, ms){

  let rows = RM_PAP[pose];
  if(pose === "sit"){ const fr = RM_TAIL[Math.floor(ms / 450) % 2];
    rows = rows.map((r, i) => i === rows.length - 2 ? fr[0] + r.slice(2) : i === rows.length - 1 ? fr[1] + r.slice(3) : r).map(r => r.replace(/T/g, "O")); }
