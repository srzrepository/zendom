  // people: breathe (1px) and blink now and then
  [["sam", 58, 22, 0], ["charlie", 79, 22, 700]].forEach(([k, x, y, ph]) => {
    if(ms > R.blink[k] + 160 && Math.random() < .012) R.blink[k] = ms;
    rmDrawPerson(B, k, x, y, ms - R.blink[k] < 160, Math.floor((ms + ph) / 1700) % 2);
  });
  const F = R.base.F.d; for(let i = 0; i < F.length; i++) if(F[i]) B.d[i] = F[i];

}
function roomBedFrame(B, ms){

let lastFocus = null;
function openSheet(title, inner, onSubmit, autofocus = true){
  if(typeof nudgeDismiss === "function" && $("#nudgeRoot").innerHTML) nudgeDismiss();
  lastFocus = document.activeElement;
  $("#sheetRoot").innerHTML = `<div class="backdrop" data-act="closeSheet"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><form class="in" id="sheetForm" novalidate>
      <div class="grab" aria-hidden="true"></div><h2 id="sheetTitle">${esc(title)}</h2>${inner}</form></div>`;
  const form = $("#sheetForm");
  form.addEventListener("submit", e => { e.preventDefault(); clearErrors(form); onSubmit(form); });
  const first = form.querySelector("input:not([type=radio]):not([type=hidden]),select,textarea");
  if(first && autofocus) setTimeout(() => first.focus({preventScroll:true}), 30);
  hydratePhotos();
}
function closeSheet(){ discardPendingPdf(); $("#sheetRoot").innerHTML = ""; if(lastFocus && document.contains(lastFocus)) lastFocus.focus({preventScroll:true}); }
function field(id, label, input, hint){ return `<div class="field" id="f-${id}"><label for="${id}">${label}</label>${input}${hint?`<span class="hint">${hint}</span>`:""}</div>`; }
function clearErrors(form){ form.querySelectorAll(".field.bad").forEach(f => { f.classList.remove("bad"); const e = f.querySelector(".err"); if(e) e.remove(); }); }
function fail(id, msg){ const f = $("#f-"+id); if(!f) return; f.classList.add("bad"); f.insertAdjacentHTML("beforeend", `<span class="err" role="alert">${esc(msg)}</span>`); const i = f.querySelector("input,select,textarea"); if(i) i.focus(); }
// Shows a duplicate warning under a field the first time; returns true to stop this save.
// Tapping Save again with the same match keeps both. openAct/openId add a button to jump to the existing one.
function warnDuplicate(form, fieldId, matchId, msg, openAct, openId){
  if(form.dataset.dupOk === matchId) return false;
  form.dataset.dupOk = matchId;
  fail(fieldId, msg);
  const f = $("#f-" + fieldId);
  if(f && openAct) f.insertAdjacentHTML("beforeend", `<button type="button" class="link" data-act="${openAct}" data-id="${esc(openId)}" style="align-self:flex-start;padding-left:0">Open the one you have</button>`);
  return true;
}
function val(form, name){ const el = form.elements[name]; return el ? String(el.value).trim() : ""; }
function footer(delAct){
  return `<div class="actions">${delAct ? `<button type="button" class="btn danger small" data-act="askDelete" data-del="${delAct}">Delete</button>` : ""}
    <div class="r"><button type="button" class="btn ghost" data-act="closeSheet">Cancel</button><button type="submit" class="btn">Save</button></div></div><div id="confirmBox"></div>`;
}
function askDelete(delAct, label){
  $("#confirmBox").innerHTML = `<div class="confirm" role="alert"><span>Delete ${esc(label)}? This can't be undone.</span>
    <div class="actions"><div class="r"><button type="button" class="btn ghost small" data-act="cancelDelete">Keep it</button><button type="button" class="btn danger small" data-act="${delAct}">Yes, delete</button></div></div></div>`;
  $("#confirmBox button").focus();
}

/* ---------- drawing pad ---------- */
const drawPad = {strokes:[], undo:[], mode:"pen", ink:INKS[0][0], pen:PENS[0][0], cur:null};
function drawPadHTML(){
  return `<div class="drawpad">
    <canvas id="drawCanvas" width="${DRAW_W}" height="${DRAW_H}" aria-label="Drawing pad. Draw with your finger, a mouse or a stylus."></canvas>
    <div class="drawtools">
      <div class="inks" role="radiogroup" aria-label="Ink color">${INKS.map(([c,l]) => `<button type="button" class="ink" data-act="drawInk" data-id="${c}" aria-label="${l} ink" aria-pressed="${drawPad.mode === "pen" && drawPad.ink === c}" style="--c:${c}"></button>`).join("")}</div>
      <div class="seg">${PENS.map(([w,l]) => `<button type="button" class="chip" data-act="drawPen" data-id="${w}" aria-pressed="${drawPad.mode === "pen" && drawPad.pen === w}">${l}</button>`).join("")}
        <button type="button" class="chip" data-act="drawEraser" aria-pressed="${drawPad.mode === "erase"}">Eraser</button></div>
      <div class="seg"><button type="button" class="chip" data-act="drawUndo" ${drawPad.undo.length ? "" : "disabled"}>Undo</button>
        <button type="button" class="chip" data-act="drawClear" ${drawPad.strokes.length ? "" : "disabled"}>Clear</button></div>
    </div></div>`;
}
function drawRefreshTools(){ const w = $("#drawWrap"); if(!w || w.hidden) return; const tools = w.querySelector(".drawtools"); const tmp = document.createElement("div"); tmp.innerHTML = drawPadHTML(); tools.replaceWith(tmp.querySelector(".drawtools")); }
function drawRepaint(){
  const cv = $("#drawCanvas"); if(!cv) return; const g = cv.getContext("2d");
  g.clearRect(0, 0, DRAW_W, DRAW_H); g.lineCap = "round"; g.lineJoin = "round";
  drawPad.strokes.concat(drawPad.cur ? [drawPad.cur] : []).forEach(st => {
    g.strokeStyle = st.c; g.lineWidth = st.w; g.beginPath(); g.moveTo(st.p[0], st.p[1]);
    if(st.p.length === 2) g.lineTo(st.p[0] + .1, st.p[1]); else for(let i = 2; i < st.p.length; i += 2) g.lineTo(st.p[i], st.p[i+1]);
    g.stroke();
  });
}
function drawPoint(cv, e){ const r = cv.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * DRAW_W), Math.round((e.clientY - r.top) / r.height * DRAW_H)]; }
function eraseAt(x, y){
  const hit = drawPad.strokes.findIndex(st => { for(let i = 0; i < st.p.length; i += 2){ const dx = st.p[i] - x, dy = st.p[i+1] - y; if(dx*dx + dy*dy <= (st.w / 2 + 22) ** 2) return true; } return false; });
  if(hit < 0) return false;
  drawPad.undo.push({kind:"erase", at:hit, st:drawPad.strokes[hit]}); drawPad.strokes.splice(hit, 1); return true;
}
function initDrawPad(){
  const cv = $("#drawCanvas"); if(!cv) return;
  drawRepaint();
  cv.addEventListener("pointerdown", e => {
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    const [x, y] = drawPoint(cv, e);
    if(drawPad.mode === "erase"){ if(eraseAt(x, y)){ drawRepaint(); drawRefreshTools(); } drawPad.cur = {erasing:true}; return; }
    if(drawPad.strokes.length >= DRAW_LIMITS.strokes){ toast("This drawing is full. Undo or clear to keep going."); return; }
    drawPad.cur = {c:drawPad.ink, w:drawPad.pen, p:[x, y]}; drawRepaint();
  });
  cv.addEventListener("pointermove", e => {
    if(!drawPad.cur) return; const [x, y] = drawPoint(cv, e);
    if(drawPad.cur.erasing){ if(eraseAt(x, y)){ drawRepaint(); drawRefreshTools(); } return; }
    const p = drawPad.cur.p, lx = p[p.length - 2], ly = p[p.length - 1];
    if((x - lx) ** 2 + (y - ly) ** 2 < 16 || p.length >= DRAW_LIMITS.points * 2) return;   // skip tiny moves
    p.push(x, y); drawRepaint();
  });
  const end = () => { const c = drawPad.cur; drawPad.cur = null; if(!c || c.erasing) return;
    drawPad.strokes.push(c); drawPad.undo.push({kind:"add"}); drawRepaint(); drawRefreshTools(); };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
}

function sinceText(ts){
  if(!ts) return "";
  const m = Math.round((Date.now() - ts) / 60000);
  if(m < 1) return "just now"; if(m < 60) return `${m} min ago`;
  const h = Math.round(m / 60); if(h < 24) return `${h} hr ago`;
  const d = Math.round(h / 24); return d === 1 ? "yesterday" : `${d} days ago`;
}

/* ============================================================
   SYNC between phones (Firebase, through window.zdBackend)
   The app always works from this phone's copy. When the website
   version is signed in, every chore, note, recipe, bill… is also a
   record "kind~id" in the shared database, so two phones merge item
   by item. Records are compared by a short hash of their JSON.
   ============================================================ */
const SYNC_KEY = "zendom:sync";                       // this phone only: {last:{key:hash|null}, ever}
const ACCOUNTS = {sam:["samzenteno@gmail.com"], charlie:["charliepurdomva@gmail.com"]};              // Google emails, lowercase: picks who's using
const SYNC_LISTS = [
  ["chore", st => st.chores], ["note", st => st.notes], ["recipe", st => st.recipes], ["meal", st => st.meals],
  ["grocery", st => st.grocery], ["pantry", st => st.pantry], ["event", st => st.events],
  ["bcat", st => st.budget.categories], ["txn", st => st.budget.txns], ["bill", st => st.budget.bills],
  ["fgoal", st => st.budget.fund.goals], ["fentry", st => st.budget.fund.entries]
];
function syncHash(str){ let h1 = 0xdeadbeef, h2 = 0x41c6ce57; for(let i = 0; i < str.length; i++){ const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(36) + (h1 >>> 0).toString(36); }
function recordsOf(st){
  const m = {};
  SYNC_LISTS.forEach(([k, get]) => get(st).forEach(x => { m[k + "~" + x.id] = x; }));
  PEOPLE.forEach(k => { m["person~" + k] = st.people[k]; });
  m["one~settings"] = st.settings;
  m["one~budget"] = {pigName: st.budget.pigName, venmo: st.budget.venmo};
  m["one~fund"] = {name: st.budget.fund.name};
  Object.entries(st.budget.plan).forEach(([mo, v]) => { m["plan~" + mo] = v; });
  return m;
}
function recordHashes(st){ const m = recordsOf(st), out = {}; for(const k in m) out[k] = syncHash(JSON.stringify(m[k])); return out; }
// data null = deleted. Unknown kinds are ignored (a newer app version may add some).
function applyRecord(st, key, data){
  const i = key.indexOf("~"); if(i < 1) return; const kind = key.slice(0, i), id = key.slice(i + 1);
  const L = SYNC_LISTS.find(x => x[0] === kind);
  if(L){ const arr = L[1](st), j = arr.findIndex(x => x.id === id);
    if(data === null || typeof data !== "object"){ if(j >= 0) arr.splice(j, 1); return; }
    const v = Object.assign({}, data, {id}); if(j >= 0) refill(arr[j], v); else arr.push(v); return; }
  if(kind === "plan" && /^\d{4}-\d{2}$/.test(id)){ if(data && typeof data === "object") st.budget.plan[id] = data; else delete st.budget.plan[id]; return; }
  if(!data || typeof data !== "object") return;                 // the singletons below are never deleted
  if(kind === "person" && PEOPLE.includes(id)){ if(st.people[id] && typeof st.people[id] === "object") refill(st.people[id], data); else st.people[id] = data; }
  else if(kind === "one" && id === "settings") st.settings = data;
  else if(kind === "one" && id === "budget"){ st.budget.pigName = data.pigName; st.budget.venmo = data.venmo; }
  else if(kind === "one" && id === "fund") st.budget.fund.name = data.name;
}
// After a remote change, reuse this phone's existing objects so anything holding them (an open edit form) stays live.
// Changed records are updated in place; untouched ones are kept exactly as they were.
function refill(o, n){ Object.keys(o).forEach(k => { if(!(k in n)) delete o[k]; }); return Object.assign(o, n); }
function keepIdentity(oldS, newS, applied){
  SYNC_LISTS.forEach(([kind, get]) => {
    const oldMap = new Map(get(oldS).map(x => [x.id, x])), arr = get(newS);
    const merged = arr.map(n => { const o = oldMap.get(n.id); if(!o) return n; return applied.has(kind + "~" + n.id) ? refill(o, n) : o; });
    arr.splice(0, arr.length, ...merged);
  });
  PEOPLE.forEach(k => { const o = oldS.people[k]; if(o) newS.people[k] = applied.has("person~" + k) ? refill(o, newS.people[k]) : o; });
  return newS;
}
function emptyHousehold(){
  const d = defaults();
  d.budget.categories = []; d.budget.txns = []; d.budget.bills = []; d.budget.plan = {}; d.budget.fund.goals = []; d.budget.fund.entries = [];
  return d;
}
const sync = {status:"off", user:null, err:"", last:{}, ever:false, unsub:null, timer:0, at:0, pending:0, offline:false, retry:0};

  const pu = pushLoad() || {}, other = nameOf(other_(sync.who || prefs.user));
  let body;
  if(!NOTIFY.vapid || !NOTIFY.url) body = `<p class="small" style="margin:0">Notifications are almost ready. They can be switched on here once setup is finished.</p>`;
  else if(!sync.user) body = `<p class="small" style="margin:0">Sign in above first. Notifications go to the phones you choose.</p>`;
  else if(IS_IOS && !IS_STANDALONE) body = `<p class="small" style="margin:0">On iPhone, notifications only work in the Home Screen app. Open zen·dom from its icon and turn them on there.</p>`;
  else if(pushState.supported === false) body = `<p class="small" style="margin:0">This browser can't show notifications.</p>`;
  else body = `
    <label class="setrow" style="cursor:pointer"><span><b>Notes and nudges from ${esc(other)}</b><span class="small muted" style="display:block">New notes, replies and meal comments right away, plus anything ${esc(other)} taps “Notify” on.</span></span>
      <input type="checkbox" data-change="pushPref" data-id="instant" ${pu.instant ? "checked" : ""} ${pushState.busy ? "disabled" : ""} style="width:26px;height:26px;accent-color:var(--accent)"></label>
    <label class="setrow" style="cursor:pointer"><span><b>Morning reminders</b><span class="small muted" style="display:block">Around 8:30 am: what's due today for both of you, and anything overdue.</span></span>
      <input type="checkbox" data-change="pushPref" data-id="morning" ${pu.morning ? "checked" : ""} ${pushState.busy ? "disabled" : ""} style="width:26px;height:26px;accent-color:var(--accent)"></label>
    <p class="small muted" style="margin:0">Both are off until you turn them on, and only for this phone. ${esc(other)} chooses for theirs.</p>
    ${pu.id ? `<div class="actions" style="justify-content:flex-start"><button type="button" class="btn ghost small" data-act="pushTest">Send a test</button></div>` : ""}`;
  return `<section class="sec"><span class="label">Notifications</span>
    <div class="card" style="display:flex;flex-direction:column;gap:12px">${body}
      ${pushState.note && !pushState.err ? `<p class="small" role="status" style="margin:0">${esc(pushState.note)}</p>` : ""}
      ${pushState.err ? `<p class="small" role="alert" style="margin:0;color:var(--late)">${esc(pushState.err)}</p>` : ""}</div></section>`;
}
const other_ = k => k === "charlie" ? "sam" : "charlie";

/* ---------- boot ---------- */
Object.assign(ACTIONS, KITCHEN_ACTIONS);
Object.assign(DELETES, KITCHEN_DELETES);
Object.assign(ACTIONS, BUDGET_ACTIONS, {
  mtab: id => { if(MTABS[id]){ prefs.moreTab = id; savePrefs(); render(); window.scrollTo(0,0); } },
  goBudget: () => { prefs.tab = "budget"; prefs.budgetTab = "spending"; budgetMonth = null; savePrefs(); render(); window.scrollTo(0,0); }
});
Object.assign(DELETES, BUDGET_DELETES, CAL_DELETES);
Object.assign(ACTIONS, CAL_ACTIONS, {
  btab: id => { if(BTABS[id]){ prefs.budgetTab = id; savePrefs(); render(); window.scrollTo(0,0); } },
  moveMoney: () => moveMoneyForm(),
  copyPlan: () => { const k = curMonth(), pk = addMonthKey(k, -1); const m = {}; state.budget.categories.forEach(c => { m[c.id] = assignedFor(pk, c.id); });
    const before = state.budget.plan[k] ? Object.assign({}, state.budget.plan[k]) : null; state.budget.plan[k] = m; save(); render();
    toast(`Copied ${monthName(pk).split(" ")[0]}'s plan`, () => { if(before) state.budget.plan[k] = before; else delete state.budget.plan[k]; save(); render(); }); },
  planBill: id => { const b = state.budget.bills.find(x => x.id === id); if(!b || !b.categoryId) return; const k = curMonth(), add = Math.ceil(b.amount / 12);
    setAssigned(k, b.categoryId, assignedFor(k, b.categoryId) + add); save(); render(); toast(`Added ${money(add)} to ${catName(b.categoryId)} for ${b.name}`); },
  fundIn: () => fundForm("in"), fundOut: () => fundForm("out"), fundMove: () => fundForm("move"),
  editFund: id => fundForm(null, id), editGoal: id => goalForm(id || null)
});
Object.assign(DELETES, {
  delFund: id => removeBy(state.budget.fund.entries, id) && "Entry deleted",
  delGoal: id => { const ok = removeBy(state.budget.fund.goals, id); if(ok) state.budget.fund.entries.forEach(e => { if(e.goalId === id) e.goalId = ""; }); return ok && "Goal deleted. Its money stays in the fund."; }
});
Object.assign(ACTIONS, IMPORT_ACTIONS, { jeffSettings: () => jeffSettingsForm() });
Object.assign(ACTIONS, {
  syncIn: async () => { const be = window.zdBackend; if(!be) return; sync.err = ""; try { await be.signIn(); } catch(e){ syncSetStatus("off", syncErrText(e)); } },
  syncOut: async () => { const be = window.zdBackend; if(!be) return;
    const pu = pushLoad(); if(pu && pu.id && be.push){ try { await be.push.removeDevice(pu.id); await be.push.disable(); } catch(e){} pushStore(null); }
    try { await be.signOut(); } catch(e){} syncStopped(); toast("Signed out. Everything stays on this phone."); },
  pushTest: () => pushTest(),
  nudgeClose: () => nudgeDismiss(),
  nudgeSend: async () => { const items = notifyQ.nudge || []; nudgeDismiss();
    const other = nameOf(other_(sync.who || prefs.user)), r = await notifySend(false, items);
    toast(!r ? "Couldn't reach the notifier." : r.sent ? `${other} was notified` : `${other} hasn't turned on notifications yet`); }
});
initKitchenInputs();
load();
syncLoad();
render();
if(window.zdBackend) window.zdBackend.onUser(u => { if(u) syncStart(u); else syncStopped(); });
setInterval(async () => { if(sync.user && window.zdBackend){ try { sync.idTok = await window.zdBackend.idToken(); } catch(e){} } }, 20 * 60000);
if(window.zdBackend && window.zdBackend.push) pushPrepare();
</script>
</body></html>
